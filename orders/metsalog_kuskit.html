<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metsälog — Okkosen Puutuote</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #faf7f2;
      --bg2:        #f3ede4;
      --bg3:        #ede4d8;
      --panel:      #ffffff;
      --border:     #e0d4c4;
      --border2:    #cfc0ac;
      --accent:     #d97706;
      --accent-dim: #b45309;
      --accent-bg:  rgba(217,119,6,0.10);
      --text:       #2a1f14;
      --text-mid:   #6b4f38;
      --text-dim:   #a08878;
      --shadow:     0 1px 4px rgba(100,60,20,0.08);
      --radius:     6px;
      --font:       'IBM Plex Sans', sans-serif;
      --mono:       'IBM Plex Mono', monospace;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* HEADER */
    header { background: var(--panel); border-bottom: 2px solid var(--accent); padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; z-index: 1000; box-shadow: var(--shadow); }
    header .logo { height: 30px; width: auto; }
    header h1 { font-size: 16px; font-weight: 500; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .header-count { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }



    /* MAIN */
    #main { display: flex; flex: 1; overflow: hidden; }
    #map { flex: 1; z-index: 1; }
    .leaflet-container { background: var(--bg2); font-family: var(--font); }
    .leaflet-control-zoom a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--border2) !important; }
    .leaflet-control-zoom a:hover { background: var(--bg2) !important; }
    .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; box-shadow: 0 6px 24px rgba(100,60,20,.15); }
    .leaflet-popup-tip { background: var(--panel); }
    .leaflet-popup-content { margin: 0; font-family: var(--font); }

    /* KARTTAPOHJAVALITSIN */
    #map-switcher { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; border-radius: 5px; overflow: hidden; border: 1px solid var(--border2); box-shadow: var(--shadow); }
    .map-sw-btn { padding: 6px 12px; font-family: var(--mono); font-size: 11px; font-weight: 600; border: none; cursor: pointer; transition: background .15s, color .15s; background: var(--panel); color: var(--text-mid); letter-spacing: .03em; }
    .map-sw-btn:first-child { border-right: 1px solid var(--border2); }
    .map-sw-btn.active { background: var(--accent); color: white; }
    .map-sw-btn:hover:not(.active) { background: var(--bg2); color: var(--text); }

    /* SIDEBAR */
    #sidebar { width: 300px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    #sidebar-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: var(--bg2); }
    #sidebar-header h2 { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); flex: 1; }
    #list { flex: 1; overflow-y: auto; padding: 8px; }
    #list::-webkit-scrollbar { width: 4px; }
    #list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .spot-card { padding: 9px 12px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 5px; cursor: pointer; transition: border-color .15s, background .15s; background: var(--panel); }
    .spot-card:hover { border-color: var(--accent-dim); background: var(--accent-bg); }
    .spot-card.active { border-color: var(--accent); background: var(--accent-bg); }
    .spot-card-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .spot-card-num { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 600; }
    .spot-card-name { font-size: 13px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spot-card-total { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
    .spot-card-items { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
    .spot-card-item { font-size: 11px; font-family: var(--mono); color: var(--text-mid); display: flex; gap: 6px; }
    .spot-card-item .laji { color: var(--accent-dim); font-weight: 600; min-width: 32px; }
    .spot-card-item .pvm { color: var(--text-dim); margin-left: auto; }

    .tag { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; }
    .tag-status-odottaa  { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .tag-status-osittain { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
    .tag-status-noudettu { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

    /* FAB */
    #fab { position: absolute; bottom: 80px; right: 20px; z-index: 1000; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 26px; cursor: pointer; box-shadow: 0 4px 14px rgba(217,119,6,.4); display: flex; align-items: center; justify-content: center; transition: transform .15s, background .15s; }
    #fab:hover { transform: scale(1.08); background: var(--accent-dim); }

    /* MODAL */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-backdrop.hidden { display: none; }
    .modal { background: var(--panel); border: 1px solid var(--border2); border-radius: 10px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(100,60,20,.2); }
    .modal-header { padding: 14px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: var(--bg2); border-radius: 10px 10px 0 0; }
    .modal-header h3 { font-size: 15px; font-weight: 600; flex: 1; }
    .modal-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); font-family: var(--mono); }
    .field input, .field select, .field textarea { background: var(--bg2); border: 1px solid var(--border2); color: var(--text); border-radius: 4px; padding: 7px 10px; font-family: var(--font); font-size: 13px; transition: border-color .15s; outline: none; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 55px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* PUULAJI-RIVIT */
    .items-section { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .items-header { background: var(--bg2); padding: 7px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .items-header span { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); }
    .items-total { font-family: var(--mono); font-size: 12px; color: var(--accent-dim); font-weight: 600; }
    .item-row { display: grid; grid-template-columns: 90px 80px 1fr 28px; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .item-row:last-of-type { border-bottom: none; }
    .item-row select, .item-row input { background: var(--bg2); border: 1px solid var(--border2); color: var(--text); border-radius: 4px; padding: 5px 7px; font-family: var(--mono); font-size: 12px; outline: none; width: 100%; }
    .item-row select:focus, .item-row input:focus { border-color: var(--accent); }
    .item-del { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 2px; line-height: 1; text-align: center; }
    .item-del:hover { color: #dc2626; }
    .add-item-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px; font-family: var(--mono); font-size: 12px; color: var(--accent-dim); background: none; border: none; cursor: pointer; width: 100%; border-top: 1px dashed var(--border2); }
    .add-item-btn:hover { background: var(--accent-bg); color: var(--accent); }

    .btn { padding: 7px 16px; border-radius: var(--radius); border: 1px solid var(--border2); font-family: var(--mono); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; letter-spacing: .03em; background: var(--panel); color: var(--text-mid); }
    .btn:hover { background: var(--bg2); color: var(--text); border-color: var(--accent); }
    .btn-accent { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-accent:hover { background: var(--accent-dim); border-color: var(--accent-dim); color: white; }
    .btn-danger { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 5px 12px; font-size: 11px; }

    /* POPUP */
    .popup-inner { padding: 12px 14px; min-width: 210px; }
    .popup-num { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 3px; }
    .popup-name { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .popup-items { font-size: 12px; }
    .popup-item-row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; border-bottom: 1px solid var(--border); color: var(--text-mid); }
    .popup-item-row:last-child { border-bottom: none; }
    .popup-item-row .laji { font-family: var(--mono); font-weight: 600; color: var(--accent-dim); }
    .popup-item-row .pvm { color: var(--text-dim); font-family: var(--mono); font-size: 11px; }
    .popup-total { margin-top: 6px; font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--accent-dim); }
    .popup-actions { display: flex; gap: 6px; margin-top: 10px; }

    /* GPS */
    #gps-btn { background: var(--bg2); border: 1px solid var(--border2); color: var(--text-mid); border-radius: 4px; padding: 6px 10px; font-family: var(--font); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    #gps-btn:hover { border-color: var(--accent); color: var(--accent); }
    .coord-display { font-family: var(--mono); font-size: 11px; color: var(--text-dim); padding: 5px 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; margin-top: 4px; }

    /* MOBILE */
    @media (max-width: 640px) {
      #sidebar { display: none; }
      #sidebar.show { display: flex; position: fixed; inset: 0; z-index: 1500; width: 100%; }
      #mob-list-btn { position: absolute; bottom: 140px; right: 16px; z-index: 1000; background: var(--panel); border: 1px solid var(--border2); color: var(--text); border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; gap: 6px; font-family: var(--mono); }
      #fab { bottom: 88px; right: 16px; }
      #sidebar-close { display: flex !important; }
    }
    #sidebar-close { display: none; background: none; border: none; color: var(--text-mid); font-size: 20px; cursor: pointer; }
    .empty-state { padding: 24px 16px; text-align: center; color: var(--text-dim); font-size: 13px; }
    #loading { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    #loading.hidden { display: none; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 13px; color: var(--text-dim); }
  </style>
</head>
<body>
<div id="loading">
  <div id="login-form" style="display:none; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:300px; padding:0 24px;">
    <img src="okkonenlogopuu.svg" style="height:48px; margin-bottom:8px;">
    <div style="font-family:var(--mono);font-size:13px;color:var(--text-mid);letter-spacing:.04em;">METSÄLOG</div>
    <input type="password" id="pw-input" placeholder="Salasana"
      style="width:100%;padding:10px 14px;border:1px solid var(--border2);border-radius:6px;background:var(--bg2);color:var(--text);font-size:15px;font-family:var(--font);outline:none;"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()"
      style="width:100%;padding:10px;background:var(--accent);color:white;border:none;border-radius:6px;font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.04em;">
      Kirjaudu sisään
    </button>
    <div id="login-error" style="color:#dc2626;font-size:12px;font-family:var(--mono);display:none;">Väärä salasana</div>
  </div>
  <div id="loading-spinner" style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div class="spinner"></div>
    <p>Ladataan…</p>
  </div>
</div>

<div id="app">
  <header>
    <img src="okkonenlogopuu.svg" alt="Okkosen Puutuote" class="logo">

    <h1>Metsälog</h1>
    <div class="header-right">
      <span class="header-count" id="total-count"></span>
    </div>
  </header>

  <div id="main" style="position:relative;">
    <div id="map"></div>
    <div id="map-switcher">
      <button class="map-sw-btn active" id="sw-osm" onclick="setLayer('osm')">OSM</button>
      <button class="map-sw-btn" id="sw-mml" onclick="setLayer('mml')">Maastokartta</button>
      <button class="map-sw-btn" id="sw-sat" onclick="setLayer('sat')">Satelliitti</button>
    </div>
    <div id="sidebar">
      <div id="sidebar-header">
        <h2>Puukasat</h2>
        <button id="sidebar-close" onclick="closeSidebar()">✕</button>
      </div>
      <div id="list"><div class="empty-state">Ladataan…</div></div>
    </div>
    <button id="fab" onclick="openAddModal()" title="Lisää uusi puukasa">+</button>
    <button id="mob-list-btn" onclick="toggleSidebar()">☰ Lista</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop hidden" id="modal-backdrop" onclick="backdropClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Uusi puukasa</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>Kaupan numero</label>
          <input type="text" id="f-kauppa" placeholder="esim. 42">
        </div>
        <div class="field">
          <label>Tila</label>
          <select id="f-tila">
            <option value="odottaa">Odottaa</option>
            <option value="osittain">Osittain noudettu</option>
            <option value="noudettu">Noudettu</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Nimi / kuvaus</label>
        <input type="text" id="f-nimi" placeholder="esim. Iso kasa tienristeyksessä">
      </div>

      <!-- PUULAJIT -->
      <div class="items-section">
        <div class="items-header">
          <span>Puulajit</span>
          <span class="items-total" id="items-total"></span>
        </div>
        <div id="items-list"></div>
        <button class="add-item-btn" onclick="addItemRow()">+ Lisää puulaji</button>
      </div>

      <div class="field">
        <label>Lisätiedot</label>
        <textarea id="f-lisatiedot" placeholder="Vapaat muistiinpanot…"></textarea>
      </div>
      <div class="field">
        <label>Sijainti</label>
        <button id="gps-btn" onclick="getGPS()">📍 Käytä nykyistä sijaintia</button>
        <div class="coord-display" id="coord-display">Klikkaa karttaa tai käytä GPS</div>
        <input type="hidden" id="f-lat">
        <input type="hidden" id="f-lng">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="delete-btn" onclick="deleteSpot()" style="display:none; margin-right:auto;">Poista</button>
      <button class="btn" onclick="closeModal()">Peruuta</button>
      <button class="btn btn-accent" onclick="saveSpot()">Tallenna</button>
    </div>
  </div>
</div>

<script>
const SUPA_URL = 'https://iofjnoxvksbaqorqaydh.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlvZmpub3h2a3NiYXFvcnFheWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MjYzNjcsImV4cCI6MjA5MTQwMjM2N30.7aYtakimbUHcxyv6Jco2ggt4VdS2F68xydTbi9suAPo';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const MML_API_KEY = '17cc0d41-99a1-49df-91b9-8c7283542cf0';
const LAJIT = ['Mät','Mäp','Mäk','Kut','Kup','Kuk','Kok','Ranka'];

let spots = [], markers = {}, editingId = null, pendingLat = null, pendingLng = null, map;

// ── NAV ──

// ── KARTTA ──
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([64.0, 26.0], 7);
  window._layers = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19
    }),
    mml: L.tileLayer(
      'https://avoin-karttakuva.maanmittauslaitos.fi/avoin/wmts/1.0.0/maastokartta/default/WGS84_Pseudo-Mercator/{z}/{y}/{x}.png?api-key=' + MML_API_KEY,
      { attribution: '© Maanmittauslaitos', maxZoom: 15, tileSize: 256 }
    ),
    sat: L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { attribution: '© Esri', maxZoom: 19 }
    )
  };
  window._layers.osm.addTo(map);
  window._currentLayer = 'osm';

  map.on('click', function(e) {
    if (!document.getElementById('modal-backdrop').classList.contains('hidden')) {
      setCoords(e.latlng.lat, e.latlng.lng); return;
    }
    openAddModal();
    setCoords(e.latlng.lat, e.latlng.lng);
  });
}

function setLayer(name) {
  if (name === window._currentLayer) return;
  map.removeLayer(window._layers[window._currentLayer]);
  window._layers[name].addTo(map);
  window._currentLayer = name;
  document.getElementById('sw-osm').classList.toggle('active', name === 'osm');
  document.getElementById('sw-mml').classList.toggle('active', name === 'mml');
  document.getElementById('sw-sat').classList.toggle('active', name === 'sat');
}

function makeIcon(tila) {
  const colors = { odottaa: '#d97706', osittain: '#f97316', noudettu: '#94a3b8' };
  const c = colors[tila] || '#d97706';
  return L.divIcon({
    className: '',
    html: `<div style="width:20px;height:20px;border-radius:50%;background:${c};border:3px solid #ffffff;box-shadow:0 2px 8px rgba(0,0,0,.35)"></div>`,
    iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -12]
  });
}

// ── DATA ──
async function loadSpots() {
  const { data, error } = await sb.from('forest_spots').select('*, forest_spot_items(*)').order('created_at', { ascending: false });
  if (error) { console.error(error); document.getElementById('list').innerHTML = '<div class="empty-state">Virhe ladattaessa</div>'; return; }
  spots = data || [];
  renderList(); renderMarkers(); updateCount();
}

function spotTotal(s) {
  return (s.forest_spot_items || []).reduce((sum, i) => sum + (parseFloat(i.maara_m3) || 0), 0);
}

function fmtDate(d) {
  if (!d) return null;
  const dt = new Date(d + 'T00:00:00');
  return dt.getDate() + '.' + (dt.getMonth()+1) + '.' + dt.getFullYear();
}

function renderList() {
  const el = document.getElementById('list');
  if (!spots.length) { el.innerHTML = '<div class="empty-state">Ei puukasooja vielä.<br>Lisää + -napilla tai klikkaa kartalta.</div>'; return; }
  el.innerHTML = spots.map(s => {
    const items = s.forest_spot_items || [];
    const total = spotTotal(s);
    const itemsHtml = items.map(i =>
      `<div class="spot-card-item">
        <span class="laji">${esc(i.puulaji)}</span>
        <span>${i.maara_m3 ? i.maara_m3 + ' m³' : '—'}</span>
        <span class="pvm">${i.pickup_date ? fmtDate(i.pickup_date) : ''}</span>
      </div>`
    ).join('');
    return `<div class="spot-card" id="card-${s.id}" onclick="selectSpot('${s.id}')">
      <div class="spot-card-top">
        <span class="spot-card-num">#${s.kauppa_numero || '—'}</span>
        <span class="spot-card-name">${esc(s.nimi || 'Nimetön')}</span>
        <span class="spot-card-total">${total > 0 ? total.toFixed(1) + ' m³' : ''}</span>
      </div>
      <div class="spot-card-items">${itemsHtml}</div>
      <div style="margin-top:6px;display:flex;align-items:center;justify-content:space-between">
        <span class="tag tag-status-${s.tila}">${tilaLabel(s.tila)}</span>
        <button class="btn btn-sm" onclick="event.stopPropagation();openEditModal('${s.id}')">Muokkaa</button>
      </div>
    </div>`;
  }).join('');
}

function renderMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  spots.forEach(s => {
    if (!s.lat || !s.lng) return;
    const m = L.marker([s.lat, s.lng], { icon: makeIcon(s.tila) }).addTo(map).bindPopup(makePopupHtml(s));
    m.on('click', () => highlightCard(s.id));
    markers[s.id] = m;
  });
}

function makePopupHtml(s) {
  const items = s.forest_spot_items || [];
  const total = spotTotal(s);
  const itemsHtml = items.map(i =>
    `<div class="popup-item-row">
      <span class="laji">${esc(i.puulaji)}</span>
      <span>${i.maara_m3 ? i.maara_m3 + ' m³' : '—'}</span>
      <span class="pvm">${i.pickup_date ? fmtDate(i.pickup_date) : ''}</span>
    </div>`
  ).join('');
  return `<div class="popup-inner">
    <div class="popup-num">#${s.kauppa_numero || '—'}</div>
    <div class="popup-name">${esc(s.nimi || 'Nimetön')}</div>
    <div class="popup-items">${itemsHtml || '<span style="color:var(--text-dim);font-size:12px">Ei puulajeja</span>'}</div>
    ${total > 0 ? `<div class="popup-total">Yhteensä: ${total.toFixed(1)} m³</div>` : ''}
    ${s.lisatiedot ? `<div style="margin-top:6px;font-size:12px;color:var(--text-mid)">${esc(s.lisatiedot)}</div>` : ''}
    <div class="popup-actions">
      <button class="btn btn-sm" onclick="openEditModal('${s.id}')">Muokkaa</button>
    </div>
  </div>`;
}

function updateCount() {
  const total = spots.reduce((sum, s) => sum + spotTotal(s), 0);
  document.getElementById('total-count').textContent = spots.length + ' kasaa · ' + total.toFixed(1) + ' m³';
}

// ── VALINTA ──
function selectSpot(id) {
  const s = spots.find(x => x.id === id);
  if (!s) return;
  highlightCard(id);
  if (s.lat && s.lng) { map.setView([s.lat, s.lng], 14); markers[id]?.openPopup(); }
  closeSidebar();
}
function highlightCard(id) {
  document.querySelectorAll('.spot-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card-' + id)?.classList.add('active');
}

// ── PUULAJI-RIVIT MODALISSA ──
let itemRows = []; // [{id, puulaji, maara_m3, pickup_date}]

function addItemRow(data) {
  const row = data || { _key: String(Date.now()), id: null, puulaji: LAJIT[0], maara_m3: '', pickup_date: '' };
  if (!data) itemRows.push(row);
  renderItemRows();
}

function removeItemRow(key) {
  itemRows = itemRows.filter(r => r._key !== key);
  renderItemRows();
}

function renderItemRows() {
  const el = document.getElementById('items-list');
  el.innerHTML = itemRows.map(r => `
    <div class="item-row">
      <select onchange="updateItemRow('${r._key}','puulaji',this.value)">
        ${LAJIT.map(l => `<option value="${l}" ${r.puulaji === l ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <input type="number" placeholder="m³" min="0" step="0.1" value="${r.maara_m3 || ''}"
        onchange="updateItemRow('${r._key}','maara_m3',this.value)"
        oninput="updateItemRow('${r._key}','maara_m3',this.value)">
      <input type="date" value="${r.pickup_date || ''}"
        onchange="updateItemRow('${r._key}','pickup_date',this.value)">
      <button class="item-del" onclick="removeItemRow('${r._key}')">✕</button>
    </div>
  `).join('');
  updateItemsTotal();
}

function updateItemRow(key, field, value) {
  const r = itemRows.find(r => r._key === key);
  if (r) { r[field] = value; updateItemsTotal(); }
}

function updateItemsTotal() {
  const total = itemRows.reduce((sum, r) => sum + (parseFloat(r.maara_m3) || 0), 0);
  document.getElementById('items-total').textContent = total > 0 ? total.toFixed(1) + ' m³' : '';
}

// ── MODAL ──
function openAddModal() {
  editingId = null; pendingLat = null; pendingLng = null;
  document.getElementById('modal-title').textContent = 'Uusi puukasa';
  document.getElementById('delete-btn').style.display = 'none';
  clearForm();
  document.getElementById('modal-backdrop').classList.remove('hidden');
}
function openEditModal(id) {
  const s = spots.find(x => x.id === id);
  if (!s) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Muokkaa puukasaa';
  document.getElementById('delete-btn').style.display = 'flex';
  document.getElementById('f-kauppa').value = s.kauppa_numero || '';
  document.getElementById('f-nimi').value = s.nimi || '';
  document.getElementById('f-tila').value = s.tila || 'odottaa';
  document.getElementById('f-lisatiedot').value = s.lisatiedot || '';
  if (s.lat && s.lng) setCoords(s.lat, s.lng);
  else { pendingLat = null; pendingLng = null; document.getElementById('coord-display').textContent = 'Ei sijaintia'; }
  // Puulajit
  itemRows = (s.forest_spot_items || []).map(i => ({ ...i, _key: String(i.id || Date.now() + Math.random()) }));
  renderItemRows();
  document.getElementById('modal-backdrop').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal-backdrop').classList.add('hidden'); editingId = null; }
function backdropClick(e) { if (e.target === document.getElementById('modal-backdrop')) closeModal(); }
function clearForm() {
  document.getElementById('f-kauppa').value = '';
  document.getElementById('f-nimi').value = '';
  document.getElementById('f-tila').value = 'odottaa';
  document.getElementById('f-lisatiedot').value = '';
  document.getElementById('f-lat').value = '';
  document.getElementById('f-lng').value = '';
  document.getElementById('coord-display').textContent = 'Klikkaa karttaa tai käytä GPS';
  itemRows = [];
  renderItemRows();
}

// ── GPS ──
function getGPS() {
  const btn = document.getElementById('gps-btn');
  btn.textContent = '⏳ Haetaan…';
  navigator.geolocation.getCurrentPosition(
    pos => { setCoords(pos.coords.latitude, pos.coords.longitude); btn.textContent = '📍 Käytä nykyistä sijaintia'; },
    err => { btn.textContent = '📍 Käytä nykyistä sijaintia'; alert('GPS ei saatavilla: ' + err.message); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
function setCoords(lat, lng) {
  pendingLat = parseFloat(parseFloat(lat).toFixed(6));
  pendingLng = parseFloat(parseFloat(lng).toFixed(6));
  document.getElementById('f-lat').value = pendingLat;
  document.getElementById('f-lng').value = pendingLng;
  document.getElementById('coord-display').textContent = pendingLat + ', ' + pendingLng;
}

// ── TALLENNUS ──
async function saveSpot() {
  const payload = {
    kauppa_numero: document.getElementById('f-kauppa').value.trim() || null,
    nimi: document.getElementById('f-nimi').value.trim() || null,
    tila: document.getElementById('f-tila').value,
    lisatiedot: document.getElementById('f-lisatiedot').value.trim() || null,
  };
  // Päivitetään koordinaatit vain jos käyttäjä on asettanut ne
  if (pendingLat !== null && pendingLng !== null) {
    payload.lat = pendingLat;
    payload.lng = pendingLng;
  }

  let spotId = editingId;
  if (editingId) {
    const { error } = await sb.from('forest_spots').update(payload).eq('id', editingId);
    if (error) { alert('Tallennus epäonnistui: ' + error.message); return; }
  } else {
    const { data, error } = await sb.from('forest_spots').insert(payload).select().single();
    if (error) { alert('Tallennus epäonnistui: ' + error.message); return; }
    spotId = data.id;
  }

  // Tallennetaan puulajit: poistetaan vanhat, lisätään uudet
  await sb.from('forest_spot_items').delete().eq('spot_id', spotId);
  const newItems = itemRows.filter(r => r.puulaji).map(r => ({
    spot_id: spotId,
    puulaji: r.puulaji,
    maara_m3: parseFloat(r.maara_m3) || null,
    pickup_date: r.pickup_date || null,
  }));
  if (newItems.length) {
    const { error } = await sb.from('forest_spot_items').insert(newItems);
    if (error) { alert('Puulajien tallennus epäonnistui: ' + error.message); return; }
  }

  closeModal();
  await loadSpots();
}

async function deleteSpot() {
  if (!editingId || !confirm('Poistetaanko tämä puukasa?')) return;
  await sb.from('forest_spot_items').delete().eq('spot_id', editingId);
  const { error } = await sb.from('forest_spots').delete().eq('id', editingId);
  if (error) { alert('Poisto epäonnistui: ' + error.message); return; }
  closeModal(); await loadSpots();
}

// ── APUFUNKTIOT ──
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('show'); }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tilaLabel(t) { return { odottaa: 'Odottaa', osittain: 'Osittain noudettu', noudettu: 'Noudettu' }[t] || t; }

// ── KUSKIT-KIRJAUTUMINEN ──
const KUSKIT_EMAIL = 'gemgommll@gmail.com';
const KUSKIT_PASS  = 'Puuk454t';

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  document.getElementById('login-error').style.display = 'none';
  if (pw !== KUSKIT_PASS) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  // Oikea salasana — piilotetaan lomake, näytetään spinner
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('loading-spinner').style.display = 'flex';
  const { error } = await sb.auth.signInWithPassword({
    email: KUSKIT_EMAIL,
    password: KUSKIT_PASS
  });
  if (error) {
    document.getElementById('loading').innerHTML = '<p style="color:#dc2626;font-family:var(--mono);font-size:13px;">Kirjautuminen epäonnistui.<br>Ota yhteys Tomi.</p>';
    return;
  }
  await loadSpots();
  document.getElementById('loading').classList.add('hidden');
}

async function init() {
  initMap();
  // Tarkistetaan onko jo sessio
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await loadSpots();
    document.getElementById('loading').classList.add('hidden');
    return;
  }
  // Näytetään salasanalomake
  document.getElementById('loading-spinner').style.display = 'none';
  document.getElementById('login-form').style.display = 'flex';
  setTimeout(() => document.getElementById('pw-input').focus(), 100);
}
init();
</script>
