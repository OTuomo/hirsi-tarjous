<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Pakkauslista — Okkosen Puutuote</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pl-bg: #16201f; --pl-panel: #1a2826; --pl-border: #244845; --pl-border-dim: #2a3f3c;
    --pl-accent: #0d9488; --pl-accent-dim: #0f766e; --pl-accent-glow: rgba(13,148,136,0.15);
    --text: #ededf0; --text-dim: #8aa8a4;
  }
  body { font-family: 'IBM Plex Sans', Arial, sans-serif; background: var(--pl-bg); color: var(--text); min-height: 100vh; }

  header { background: #0f1917; border-bottom: 2px solid var(--pl-accent); padding: 14px 22px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 15px; font-weight: 700; color: var(--pl-accent); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.04em; }
  header .quote-info { font-size: 12px; color: var(--text-dim); }
  header .saving { font-size: 11px; color: var(--pl-accent); font-family: 'IBM Plex Mono', monospace; margin-left: auto; }

  .page { max-width: 900px; margin: 0 auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; }

  .pl-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }

  .pl-section { background: var(--pl-panel); border: 1px solid var(--pl-border); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .pl-section-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pl-section-header input[type=text] { flex: 1; min-width: 160px; background: var(--pl-bg); border: 1px solid var(--pl-border); color: var(--text); border-radius: 4px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
  .pl-section-header input[type=text]:focus { border-color: var(--pl-accent); outline: none; }
  .pl-pkg-input { width: 50px; background: var(--pl-bg); border: 1px solid var(--pl-border); color: var(--pl-accent); border-radius: 4px; padding: 6px 4px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .pl-pkg-input:focus { border-color: var(--pl-accent); outline: none; }
  .pl-pkg-label { font-size: 10px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }

  .pl-row { display: grid; grid-template-columns: 1fr 1.4fr 70px 70px 150px 28px; gap: 6px; align-items: center; }
  .pl-row input, .pl-row select { background: var(--pl-bg); border: 1px solid var(--pl-border-dim); color: var(--text); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: inherit; }
  .pl-row input:focus, .pl-row select:focus { border-color: var(--pl-accent); outline: none; }
  .pl-row select { color: var(--text-dim); cursor: pointer; }
  .pl-row select:hover { border-color: var(--pl-accent); }
  .pl-row-del { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 2px; }
  .pl-row-del:hover { color: #f87171; }
  .pl-row.excluded { opacity: 0.45; }
  .pl-row.excluded input, .pl-row.excluded select { pointer-events: none; background: transparent; border-color: transparent; text-decoration: line-through; }
  .pl-row-note.excluded { opacity: 0.45; text-decoration: line-through; }
  .pl-row-restore { background: transparent; border: none; color: var(--pl-accent); cursor: pointer; font-size: 13px; padding: 2px; white-space: nowrap; }
  .pl-row-restore:hover { text-decoration: underline; }
  .pl-expand-link { font-size: 10px; color: #5b9bd5; cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
  .pl-expand-link:hover { text-decoration: underline; }
  .pl-nimike-cell { display: flex; flex-direction: column; gap: 3px; }
  .pl-row-note { display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-style: italic; color: var(--text-dim); font-size: 12px; border-left: 2px solid var(--pl-border); margin-left: 4px; }
  .pl-row-note span { flex: 1; }

  .pl-add-row { background: transparent; border: 1px dashed var(--pl-border-dim); color: var(--text-dim); border-radius: 4px; padding: 6px; font-size: 11px; cursor: pointer; text-align: center; }
  .pl-add-row:hover { border-color: var(--pl-accent); color: var(--pl-accent); }
  .pl-section-del { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 4px 6px; }
  .pl-section-del:hover { color: #f87171; }
  .pl-section-excluded { padding: 8px 14px; opacity: 0.55; }
  .pl-section-excluded .pl-section-header { justify-content: space-between; }
  .pl-section-excluded-name { font-size: 13px; font-weight: 600; text-decoration: line-through; }
  .pl-section-excluded-tag { font-size: 11px; font-weight: 400; text-decoration: none; color: var(--text-dim); margin-left: 8px; }

  .pl-btn { background: var(--pl-accent); color: #0f1917; border: none; border-radius: 5px; padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .pl-btn:hover { background: #14b8a6; }
  .pl-btn-ghost { background: transparent; border: 1px solid var(--pl-border-dim); color: var(--text-dim); border-radius: 5px; padding: 9px 18px; font-size: 13px; cursor: pointer; }
  .pl-btn-ghost:hover { border-color: var(--pl-accent); color: var(--pl-accent); }

  .pl-empty-hint { text-align: center; color: var(--text-dim); font-size: 14px; padding: 60px 20px; }
  .loading { text-align: center; padding: 60px; font-size: 14px; color: var(--text-dim); }

  @media (max-width: 720px) {
    .pl-row { grid-template-columns: 1fr; }
    .pl-row-del { justify-self: flex-end; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
</head>
<body>

<header>
  <h1>📦 PAKKAUSLISTA</h1>
  <span class="quote-info" id="quoteInfo">Ladataan...</span>
  <span class="saving" id="packingSaveStatus"></span>
</header>

<div class="page" id="root">
  <div class="loading">Ladataan...</div>
</div>

<script>
const SUPABASE_URL = 'https://iofjnoxvksbaqorqaydh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlvZmpub3h2a3NiYXFvcnFheWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MjYzNjcsImV4cCI6MjA5MTQwMjM2N30.7aYtakimbUHcxyv6Jco2ggt4VdS2F68xydTbi9suAPo';

async function sbGet(table, query='') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  return r.json();
}
async function sbPatch(table, id, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'PATCH',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify(data)
  });
  return r.json();
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

let currentQuoteId = null;
let packingSections = [];
let packingSectionIdCounter = 0;
let packingRowIdCounter = 0;
let _packingSaveTimer = null;
let quoteSections = []; // tarjouksen omat osiot/rivit, käytetään vain "kopioi pohjaksi" -toimintoon
let productsById = {};
let componentsByParent = {};

window.addEventListener('DOMContentLoaded', async () => {
  await window._authReady;
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) {
    document.getElementById('root').innerHTML = '<div class="pl-empty-hint">Tarjousnumero puuttuu URL:sta.</div>';
    return;
  }
  currentQuoteId = id;

  const data = await sbGet('quotes', `?id=eq.${id}&select=*`);
  const q = Array.isArray(data) ? data[0] : null;
  if (!q) {
    document.getElementById('root').innerHTML = '<div class="pl-empty-hint">Tarjousta ei löydy.</div>';
    return;
  }

  let custName = '';
  if (q.customer_id) {
    const custArr = await sbGet('customers', `?id=eq.${q.customer_id}&select=name`);
    if (Array.isArray(custArr) && custArr[0]) custName = custArr[0].name;
  }
  document.getElementById('quoteInfo').textContent =
    `${q.quote_number || 'Tallentamaton tarjous'}${custName ? ' — ' + custName : ''}`;
  document.title = `Pakkauslista — ${custName || q.quote_number || ''}`;

  try { quoteSections = JSON.parse(q.sections_json || '[]'); } catch(e) { quoteSections = []; }

  const [productsArr, componentsArr] = await Promise.all([
    sbGet('products', '?select=id,code,name,unit,pricing_model'),
    sbGet('product_components', '?select=parent_product_id,component_product_id,quantity')
  ]);
  (Array.isArray(productsArr) ? productsArr : []).forEach(p => { productsById[p.id] = p; });
  (Array.isArray(componentsArr) ? componentsArr : []).forEach(c => {
    if (!componentsByParent[c.parent_product_id]) componentsByParent[c.parent_product_id] = [];
    componentsByParent[c.parent_product_id].push(c);
  });

  if (q.packing_list_json) {
    try {
      packingSections = JSON.parse(q.packing_list_json);
      packingSections.forEach(s => s.rows.forEach(r => { if (r.id > packingRowIdCounter) packingRowIdCounter = r.id; }));
      packingSections.forEach(s => { if (s.id > packingSectionIdCounter) packingSectionIdCounter = s.id; });
    } catch(e) { packingSections = []; }
  }

  renderPage();
});

function renderPage() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="pl-toolbar">
      <button class="pl-btn-ghost" onclick="copyQuoteRowsToPacking()">⤵ Kopioi tarjouksen rivit pohjaksi</button>
      <button class="pl-btn-ghost" onclick="addPackingSection()">+ Uusi osio</button>
      <button class="pl-btn-ghost" onclick="printPackingList()" title="Avaa tuloste uuteen välilehteen">🖨 Tulosta</button>
    </div>
    <div id="packingBody" style="display:flex;flex-direction:column;gap:16px;"></div>
  `;
  renderPackingBody();
}

function renderPackingBody() {
  const body = document.getElementById('packingBody');
  if (!packingSections.length) {
    body.innerHTML = `<div class="pl-empty-hint">Pakkauslista on vielä tyhjä.<br>Aloita kopioimalla tarjouksen rivit pohjaksi, tai lisää osio käsin.</div>`;
    return;
  }
  body.innerHTML = packingSections.map(sec => sec.excluded ? `
    <div class="pl-section pl-section-excluded" data-sec="${sec.id}">
      <div class="pl-section-header">
        <span class="pl-section-excluded-name">${esc(sec.name || '(nimetön osio)')}${sec.packageNumber ? ` — Paketti ${esc(String(sec.packageNumber))}` : ''} <span class="pl-section-excluded-tag">poistettu tulosteesta · ${sec.rows.length} rivi${sec.rows.length===1?'':'ä'}</span></span>
        <button class="pl-row-restore" onclick="toggleSectionExcluded(${sec.id})" title="Palauta osio listalle">↺ palauta osio</button>
      </div>
    </div>
  ` : `
    <div class="pl-section" data-sec="${sec.id}">
      <div class="pl-section-header">
        <input type="text" value="${esc(sec.name)}" oninput="onPackingSectionName(${sec.id},this.value)" placeholder="Osion nimi">
        <span class="pl-pkg-label">Paketti nro</span>
        <input type="number" class="pl-pkg-input" value="${sec.packageNumber||''}" oninput="onPackingSectionPkg(${sec.id},this.value)" placeholder="—" min="1" step="1">
        <button class="pl-section-del" onclick="toggleSectionExcluded(${sec.id})" title="Poista osio tulosteesta">✕</button>
      </div>
      ${sec.rows.map(row => row.isNote ? `
        <div class="pl-row-note${row.excluded ? ' excluded' : ''}" data-row="${row.id}">
          <span>${esc(row.nimikeTeksti||'')}</span>
          <button class="${row.excluded ? 'pl-row-restore' : 'pl-row-del'}" onclick="toggleRowExcluded(${sec.id},${row.id})" title="${row.excluded ? 'Palauta rivi listalle' : 'Poista rivi tulosteesta'}">${row.excluded ? '↺ palauta' : '✕'}</button>
        </div>
      ` : `
        <div class="pl-row${row.excluded ? ' excluded' : ''}" data-row="${row.id}">
          <div class="pl-nimike-cell">
            <input type="text" value="${esc(row.nimikeTeksti||'')}" oninput="onPackingRowInput(${sec.id},${row.id},'nimikeTeksti',this.value)" placeholder="Kohde" ${row.excluded ? 'readonly' : ''}>
            ${row.isAssembly && row.productId && !row.excluded ? `<span class="pl-expand-link" onclick="expandPackingRow(${sec.id},${row.id})">⚙ ▾ avaa komponentit</span>` : ''}
          </div>
          <input type="text" value="${esc(row.desc||'')}" oninput="onPackingRowInput(${sec.id},${row.id},'desc',this.value)" placeholder="Kuvaus / lisätiedot" ${row.excluded ? 'readonly' : ''}>
          <input type="number" value="${row.qty||''}" oninput="onPackingRowInput(${sec.id},${row.id},'qty',this.value)" placeholder="Määrä" step="0.01" style="text-align:right;" ${row.excluded ? 'readonly' : ''}>
          <input type="text" value="${esc(row.unit||'')}" oninput="onPackingRowInput(${sec.id},${row.id},'unit',this.value)" placeholder="Yks" ${row.excluded ? 'readonly' : ''}>
          <select onchange="moveRowToSection(${sec.id},${row.id},this.value)" title="Siirrä toiseen osioon" ${row.excluded ? 'disabled' : ''}>
            <option value="">↳ Siirrä osioon...</option>
            ${packingSections.filter(s => s.id !== sec.id && !s.excluded).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
          </select>
          <button class="${row.excluded ? 'pl-row-restore' : 'pl-row-del'}" onclick="toggleRowExcluded(${sec.id},${row.id})" title="${row.excluded ? 'Palauta rivi listalle' : 'Poista rivi tulosteesta'}">${row.excluded ? '↺' : '✕'}</button>
        </div>
      `).join('')}
      <div class="pl-add-row" onclick="addPackingRow(${sec.id})">+ Lisää rivi</div>
    </div>
  `).join('');
}

// Avaa kokoonpanorivin komponentteihin: korvaa rivin huomiorivillä + muokattavilla komponenttiriveillä
function expandPackingRow(secId, rowId) {
  const sec = packingSections.find(s => s.id === secId);
  if (!sec) return;
  const idx = sec.rows.findIndex(r => r.id === rowId);
  if (idx === -1) return;
  const row = sec.rows[idx];
  const comps = componentsByParent[row.productId];
  if (!comps || !comps.length) { alert('Tälle tuotteelle ei ole rekisteröity komponentteja hinnastossa.'); return; }

  const noteRow = {
    id: ++packingRowIdCounter,
    isNote: true,
    nimikeTeksti: `↳ ${row.nimikeTeksti || row.desc || ''} (${row.qty || ''} kpl) — sisältää:`
  };
  const newRows = comps.map(c => {
    const prod = productsById[c.component_product_id];
    return {
      id: ++packingRowIdCounter,
      nimikeTeksti: prod ? prod.name : '(tuote puuttuu)',
      desc: '',
      qty: (parseFloat(row.qty) || 0) * (parseFloat(c.quantity) || 0),
      unit: prod ? (prod.unit || '') : ''
    };
  });
  sec.rows.splice(idx, 1, noteRow, ...newRows);
  renderPackingBody();
  autoSavePacking();
}

function addPackingSection(name='') {
  const id = ++packingSectionIdCounter;
  packingSections.push({ id, name: name || `Osio ${id}`, packageNumber: null, rows: [] });
  renderPackingBody();
  addPackingRow(id);
}

function toggleSectionExcluded(secId) {
  const sec = packingSections.find(s => s.id === secId);
  if (!sec) return;
  sec.excluded = !sec.excluded;
  renderPackingBody();
  autoSavePacking();
}

function onPackingSectionName(secId, val) {
  const sec = packingSections.find(s => s.id === secId);
  if (sec) { sec.name = val; autoSavePacking(); }
}

function onPackingSectionPkg(secId, val) {
  const sec = packingSections.find(s => s.id === secId);
  if (sec) { sec.packageNumber = val ? parseInt(val) : null; autoSavePacking(); }
}

function addPackingRow(secId) {
  const sec = packingSections.find(s => s.id === secId);
  if (!sec) return;
  const id = ++packingRowIdCounter;
  sec.rows.push({ id, nimikeTeksti: '', desc: '', qty: '', unit: '', productId: null, isAssembly: false });
  renderPackingBody();
}

function toggleRowExcluded(secId, rowId) {
  const sec = packingSections.find(s => s.id === secId);
  const row = sec && sec.rows.find(r => r.id === rowId);
  if (!row) return;
  row.excluded = !row.excluded;
  renderPackingBody();
  autoSavePacking();
}

function onPackingRowInput(secId, rowId, field, val) {
  const sec = packingSections.find(s => s.id === secId);
  const row = sec && sec.rows.find(r => r.id === rowId);
  if (row) { row[field] = val; autoSavePacking(); }
}

// Siirtää rivin osiosta toiseen säilyttäen kaikki tiedot
function moveRowToSection(fromSecId, rowId, toSecIdRaw) {
  if (!toSecIdRaw) return; // "Siirrä osioon..." -placeholder valittu, ei tehdä mitään
  const toSecId = parseInt(toSecIdRaw);
  const fromSec = packingSections.find(s => s.id === fromSecId);
  const toSec = packingSections.find(s => s.id === toSecId);
  if (!fromSec || !toSec) return;
  const rowIdx = fromSec.rows.findIndex(r => r.id === rowId);
  if (rowIdx === -1) return;
  const [row] = fromSec.rows.splice(rowIdx, 1);
  toSec.rows.push(row);
  renderPackingBody();
  autoSavePacking();
}

// Kopioi tarjouksen nykyiset osiot/rivit pakkauslistan pohjaksi.
function copyQuoteRowsToPacking() {
  const hasContent = packingSections.some(s => s.rows.length > 0);
  if (hasContent) {
    if (!confirm('Pakkauslistalla on jo rivejä. Korvataanko ne tarjouksen riveillä?\n\nTämä poistaa kaikki nykyiset pakkauslistan muokkaukset.')) return;
  }
  packingSections = [];
  packingSectionIdCounter = 0;
  packingRowIdCounter = 0;
  quoteSections.forEach(sec => {
    if (!sec.active) return;
    const newSec = { id: ++packingSectionIdCounter, name: sec.name, packageNumber: null, rows: [] };
    sec.rows.forEach(row => {
      if (!row.nimikeTeksti && !row.desc) return;
      newSec.rows.push({
        id: ++packingRowIdCounter,
        nimikeTeksti: row.nimikeTeksti || '',
        desc: row.desc || '',
        qty: row.qty || '',
        unit: row.unit || '',
        productId: row.productId || null,
        isAssembly: !!row.isAssembly
      });
    });
    packingSections.push(newSec);
  });
  renderPackingBody();
  autoSavePacking();
}

function printPackingList() {
  window.open(`print_supply.html?id=${currentQuoteId}`, '_blank');
}

function autoSavePacking() {
  const el = document.getElementById('packingSaveStatus');
  if (el) el.textContent = 'Tallennetaan...';
  clearTimeout(_packingSaveTimer);
  _packingSaveTimer = setTimeout(saveDraftPacking, 1200);
}

async function saveDraftPacking() {
  const el = document.getElementById('packingSaveStatus');
  if (!currentQuoteId) return;
  try {
    await sbPatch('quotes', currentQuoteId, { packing_list_json: JSON.stringify(packingSections) });
    if (el) { el.textContent = '✓ Tallennettu'; setTimeout(() => { if (el.textContent === '✓ Tallennettu') el.textContent = ''; }, 2000); }
  } catch(e) {
    if (el) el.textContent = '⚠ Virhe tallennuksessa';
    console.error('saveDraftPacking:', e);
  }
}
</script>
</body>
</html>
