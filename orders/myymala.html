<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myymälä — Okkosen Puutuote</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root {
    --bg: #1c1a14; --panel: #2a2720; --border: #4a4535;
    --accent: #d97706; --accent-dim: #b45309; --accent-glow: rgba(217,119,6,0.15);
    --text: #ededf0; --text-dim: #9595a0; --input-bg: #333028;
    --success: #3dba6e; --danger: #e84040; --warn: #e8a020; --section-header: #222018;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
  header { background: #141210; border-bottom: 2px solid var(--accent); padding: 10px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  header .logo { height: 32px; width: auto; }
  header h1 { font-size: 16px; font-weight: 500; color: var(--text); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-menu-wrap { position: relative; }
  .nav-btn { background: #3a3545; border: 1px solid #585568; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 4px; cursor: pointer; letter-spacing: 0.04em; }
  .nav-btn:hover { background: #4a4558; }
  .nav-dropdown { display: none; position: absolute; top: calc(100% + 6px); left: 0; background: #3a3545; border: 1px solid var(--border); border-radius: 6px; min-width: 200px; z-index: 999; box-shadow: 0 4px 16px rgba(0,0,0,0.4); overflow: hidden; }
  .nav-dropdown.open { display: block; }
  .nav-section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); padding: 8px 14px 4px; }
  .nav-item { display: block; width: 100%; text-align: left; padding: 8px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text); background: none; border: none; cursor: pointer; text-decoration: none; transition: background 0.1s; }
  .nav-item:hover { background: var(--accent-glow); color: var(--accent); }
  .nav-item.current { color: var(--accent); font-weight: 600; }
  .nav-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  .btn { padding: 8px 14px; border: none; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: 0.04em; transition: background 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #686578; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-warn { background: var(--warn); color: #1a1a1a; }
  .btn-warn:hover { background: #f0b030; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-xs { padding: 3px 7px; font-size: 10px; }
  .saving { font-size: 11px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .saving.ok { color: var(--success); }
  .saving.err { color: var(--danger); }
  .page { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; display: flex; flex-direction: column; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
  .panel-header { background: var(--section-header); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; padding: 10px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .panel-body { padding: 16px; }
  .basics-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; }
  .basics-row2 { display: flex; gap: 12px; margin-top: 12px; align-items: flex-end; }
  .basics-row2 .field { flex: 0 0 180px; }
  .basics-row2 .field-quotenum { margin-left: auto; flex: 0 0 160px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  label { font-size: 11px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  input, select, textarea { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 7px 9px; border-radius: 4px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input[readonly] { color: var(--text-dim); cursor: default; background: #252218; border-color: transparent; }
  input::placeholder, textarea::placeholder { color: var(--text-dim); }
  select option { background: var(--panel); }
  textarea { resize: vertical; min-height: 100px; }

  /* ASIAKASHAKU */
  .customer-row { display: flex; gap: 8px; align-items: flex-end; }
  .customer-row .customer-search-wrap { flex: 1; }
  .customer-search-wrap { position: relative; }
  .customer-dropdown { display: none; position: absolute; top: calc(100% + 2px); left: 0; right: 0; background: #3a3530; border: 1px solid var(--border); border-radius: 4px; z-index: 50; max-height: 240px; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .customer-dropdown.open { display: block; }
  .cust-option { padding: 8px 12px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-bottom: 1px solid var(--border); }
  .cust-option:last-child { border-bottom: none; }
  .cust-option:hover { background: var(--accent-glow); color: var(--accent); }
  .cust-option .cust-num { font-size: 10px; color: var(--text-dim); margin-left: 8px; }

  /* ASIAKKAAN OSOITETIEDOT (read-only) */
  .customer-info-display { margin-top: 6px; padding: 7px 11px; background: #222018; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; color: var(--text-dim); line-height: 1.6; display: none; }
  .customer-info-display.show { display: block; }
  .customer-info-display .cid-label { color: var(--accent); font-weight: 600; font-size: 11px; letter-spacing: 0.04em; margin-right: 4px; }

  /* NIMIKEHAKU */
  .nimike-wrap { position: relative; }
  .nimike-dropdown { display: none; position: fixed; min-width: 320px; background: #3a3530; border: 1px solid var(--border); border-radius: 4px; z-index: 500; max-height: 400px; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  .nimike-dropdown.open { display: block; }
  .nimike-option { padding: 6px 10px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 11px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nimike-option:hover { background: var(--accent-glow); color: var(--accent); }
  .nimike-option.active { background: var(--accent-glow); color: var(--accent); }
  .nimike-option .nimike-code { color: var(--text-dim); margin-right: 6px; font-size: 10px; }
  .assembly-tag { display: inline-block; margin-top: 3px; font-size: 9px; font-family: 'IBM Plex Mono', monospace; color: #5b9bd5; background: rgba(91,155,213,0.12); border: 1px solid rgba(91,155,213,0.3); border-radius: 3px; padding: 1px 5px; letter-spacing: 0.03em; }

  /* SECTION ROW */
  .section-row { background: #222018; border: 1px solid var(--border); border-radius: 5px; margin-bottom: 4px; }
  .section-row.inactive { opacity: 0.45; }
  .section-row-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .section-row-header input[type="text"] { background: transparent; border: none; color: var(--text); font-weight: 600; font-size: 13px; padding: 0; width: auto; flex: 1; }
  .section-row-header input[type="text"]:focus { border-bottom: 1px solid var(--accent); outline: none; }
  .section-toggle { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid var(--accent); background: none; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; }
  .section-toggle.on { background: var(--accent); }
  .section-toggle.on::after { content: '✓'; color: #fff; font-size: 10px; line-height: 1; }
  .move-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 3px; }
  .move-btn:hover { background: var(--accent-glow); color: var(--accent); }
  .section-subtotal { padding: 6px 12px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); text-align: right; }
  .section-subtotal span { color: var(--accent); font-weight: 600; }
  .product-rows { overflow-x: auto; overflow-y: visible; }
  table.product-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 640px; }
  table.product-table th { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  table.product-table th.right { text-align: right; }
  table.product-table td { padding: 3px 4px; vertical-align: middle; border-bottom: 1px solid #33302a; }
  table.product-table tr:last-child td { border-bottom: none; }
  table.product-table input, table.product-table select { padding: 5px 7px; font-size: 12px; }
  .price-manual { background: rgba(217,119,6,0.18) !important; }
  .restore-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 11px; padding: 2px 4px; }
  .restore-btn:hover { color: var(--accent); }
  /* Näkyy à-hinta-kentän vieressä kun käsin muokattu hinta on MATALAMPI kuin hinnaston basePrice
     (aito alennus). Jos hintaa on nostettu käsin, tätä ei näytetä — vain restore-btn näkyy silloin. */
  .discount-badge { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; color: var(--success); background: rgba(61,186,110,0.14); border: 1px solid rgba(61,186,110,0.35); border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
  .del-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; padding: 2px 5px; border-radius: 3px; }
  .del-btn:hover { background: rgba(232,64,64,0.15); }
  .add-row-wrap { padding: 6px 12px 10px; }

  /* YHTEENVETO */
  .summary-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px 20px; display: flex; justify-content: flex-end; }
  .summary-table { font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 320px; }
  .summary-table tr td { padding: 4px 0; }
  .summary-table .label { color: var(--text-dim); padding-right: 16px; }
  .summary-table .value { text-align: right; color: var(--text); }
  .summary-table .big td { font-size: 16px; font-weight: 600; color: var(--accent); padding-top: 8px; border-top: 1px solid var(--border); }
  .summary-table input.adj { width: 90px; text-align: right; padding: 4px 7px; font-size: 12px; }
  .default-text-wrap textarea { width: 100%; min-height: 100px; font-size: 12px; }
  .action-bar { display: flex; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
  /* Varmista että status-valikko ei leikkaudu sivun alareunassa */
  .action-bar select { max-height: 200px; }
  .action-bar .spacer { flex: 1; }
  .status-badge { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; padding: 6px 16px; border-radius: 5px; letter-spacing: 0.06em; }
  .status-badge.draft    { background: #44444f; color: var(--text-dim); }
  .status-badge.progress { background: #3d2e1e; color: var(--warn); }
  .status-badge.sent     { background: #1e3d2e; color: var(--success); }
  .status-badge.ordered  { background: #1e2e3d; color: #5b9bd5; }
  .status-badge.completed{ background: #1e3d2e; color: #4ade80; }
  .status-badge.model    { background: #2a1e3d; color: #c084fc; }
  .status-badge.archived { background: #2a2a2a; color: #666; }
  .stale-banner { display: none; align-items: center; gap: 10px; background: #3d2e1e; border: 1px solid var(--warn); color: var(--warn); font-size: 13px; padding: 10px 16px; border-radius: 6px; margin-bottom: 16px; font-family: 'IBM Plex Sans', sans-serif; }
  .stale-banner.show { display: flex; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; width: 480px; max-width: 96vw; display: flex; flex-direction: column; gap: 14px; }
  .modal h2 { font-size: 15px; font-weight: 600; color: var(--accent); font-family: 'IBM Plex Mono', monospace; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  /* MOBIILI */
  @media (max-width: 640px) {
    .basics-grid { grid-template-columns: 1fr 1fr; }
    .page { padding: 12px 12px 60px; gap: 12px; }
    table.product-table { display: none; }
    .product-card-list { display: block !important; }
    .summary-table { width: 100%; }
    .action-bar { flex-direction: column; }
  }
  .product-card-list { display: none; }
  .product-card { background: var(--input-bg); border: 1px solid var(--border); border-radius: 5px; padding: 10px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  .product-card .card-row { display: flex; gap: 8px; align-items: center; }
  .product-card label { min-width: 60px; }

  /* VIIKKOSELAIN */
  .week-picker { display: flex; align-items: center; gap: 4px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; height: 32px; }
  .week-picker:focus-within { border-color: var(--accent); }
  .week-arrow { background: none; border: none; color: var(--text-dim); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 3px; border-radius: 3px; font-family: inherit; flex-shrink: 0; }
  .week-arrow:hover { color: var(--accent); background: var(--accent-glow); }
  .week-input { background: transparent; border: none; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 28px; text-align: center; padding: 0; outline: none; }
  .week-input::placeholder { color: var(--text-dim); }
  .week-dates { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); white-space: nowrap; flex: 1; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
</head>
<body>

<header>
  <img src="okkonenlogopuu.svg" alt="Okkosen Puutuote" class="logo">
  <div class="nav-menu-wrap">
    <button class="nav-btn" onclick="toggleNav(event)">☰ Valikko</button>
    <div class="nav-dropdown" id="navDropdown">
      <div class="nav-section-label">Sivut</div>
      <a class="nav-item" href="asiakkaat.html">👤 Asiakkaat</a>
      <a class="nav-item" href="hinnasto.html">📦 Hinnasto</a>
      <a class="nav-item" href="tarjoukset.html">📋 Tarjoukset</a>
      <a class="nav-item" href="tarjous.html">✏️ Uusi Tarjous</a>
      <a class="nav-item current" href="myymala.html">🏪 Myymälä</a>
      <a class="nav-item" href="kalenteri.html">📅 Kalenteri</a>
      <a class="nav-item current" href="todo.html">✅ Muistilista</a>
    </div>
  </div>
  <h1>Myymälä</h1>
  <div class="header-right">
    <span class="saving" id="saveStatus"></span>
    <button class="btn btn-secondary" onclick="saveDraft()" style="padding:6px 14px;font-size:12px;">💾 Tallenna ostos</button>
  </div>
</header>


<!-- LISÄÄ ASIAKAS MODAL -->
<div class="modal-overlay" id="newCustModal">
  <div class="modal">
    <h2>Uusi asiakas</h2>
    <div class="modal-grid">
      <div class="field" style="grid-column:1/-1">
        <label>Nimi *</label>
        <input type="text" id="nc_name" placeholder="Yritys tai henkilö">
      </div>
      <div class="field">
        <label>Puhelin</label>
        <input type="text" id="nc_phone" placeholder="0400 000 000">
      </div>
      <div class="field">
        <label>Sähköposti</label>
        <input type="text" id="nc_email" placeholder="email@example.com">
      </div>
      <div class="field">
        <label>Osoite</label>
        <input type="text" id="nc_address" placeholder="Katuosoite">
      </div>
      <div class="field">
        <label>Kaupunki</label>
        <input type="text" id="nc_city" placeholder="Kaupunki">
      </div>
      <div class="field" style="grid-column:1/-1;border-top:1px solid var(--border);margin-top:4px;padding-top:10px;">
        <label style="text-transform:uppercase;letter-spacing:0.06em;">Laskutusosoite (jos eri kuin yllä)</label>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>Laskutusosoite — katuosoite</label>
        <input type="text" id="nc_billing_address" placeholder="Katuosoite">
      </div>
      <div class="field">
        <label>Postinumero</label>
        <input type="text" id="nc_billing_postal_code" placeholder="00100">
      </div>
      <div class="field">
        <label>Laskutuskaupunki</label>
        <input type="text" id="nc_billing_city" placeholder="Kaupunki">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>Y-tunnus</label>
        <input type="text" id="nc_business_id" placeholder="1234567-8">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeNewCustModal()">Peruuta</button>
      <button class="btn btn-primary btn-sm" onclick="saveNewCustomer()">Tallenna asiakas</button>
    </div>
  </div>
</div>

<!-- KATEPROSENTTI-MODAALI (sisäinen, ei koskaan tulosteelle) -->
<div class="modal-overlay" id="kateModal">
  <div class="modal" style="width:440px;max-height:80vh;overflow-y:auto;">
    <h2>📊 Kateprosentti (sisäinen)</h2>
    <div id="kateModalBody" style="font-size:12px;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeKateModal()">Sulje</button>
    </div>
  </div>
</div>

<div class="page">

  <!-- PERUSTIEDOT -->
  <div class="panel">
    <div class="panel-header">Perustiedot</div>
    <div class="panel-body">
      <div class="basics-grid">
        <div class="field">
          <label>Asiakas</label>
          <div class="customer-row">
            <div class="customer-search-wrap">
              <input type="text" id="customerSearch" placeholder="Hae nimellä..." autocomplete="off"
                oninput="searchCustomers(this.value)" onfocus="searchCustomers(this.value)">
              <div class="customer-dropdown" id="customerDropdown"></div>
            </div>
            <button class="btn btn-ghost btn-sm" style="white-space:nowrap;flex-shrink:0;" onclick="setCashCustomer()" title="Merkitse käteisasiakkaaksi ilman nimeä">⚡ Käteinen</button>
            <button class="btn btn-ghost btn-sm" style="white-space:nowrap;flex-shrink:0;" onclick="openNewCustModal()" title="Lisää uusi asiakas">+ Asiakas</button>
          </div>
          <div class="customer-info-display" id="customerInfoDisplay"></div>
          <input type="hidden" id="customerId">
        </div>
        <div class="field">
          <label>Päivämäärä</label>
          <input type="date" id="quoteDate" onchange="autoSave()">
        </div>
        <div class="field field-quotenum">
          <label>Kuittinumero</label>
          <input type="text" id="quoteNumber" readonly placeholder="Automaattinen">
        </div>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Huomiot</label>
        <input type="text" id="quoteRef" placeholder="Vapaa huomio ostosta" oninput="autoSave()">
      </div>
    </div>
  </div>

  <!-- OSIOT JA TUOTERIVIT -->
  <div class="panel">
    <div class="panel-header">
      Tuoterivit
      <span style="margin-left:auto;"></span>
      <button class="btn btn-secondary btn-sm" onclick="addSection()">+ Lisää osio</button>
    </div>
    <div class="panel-body" style="padding:12px;">
      <div id="sectionsContainer"></div>
    </div>
  </div>

  <!-- YHTEENVETO -->
  <div class="summary-panel">
    <table class="summary-table">
      <tr><td class="label">Välisumma</td><td class="value" id="sumSubtotal">0,00 €</td></tr>
      <tr>
        <td class="label">Alennus %</td>
        <td class="value">
          <div style="display:flex;align-items:center;gap:4px;justify-content:flex-end;">
            <input class="adj" type="number" id="discountPercent" value="0" step="0.1" min="0" max="100" oninput="onDiscountPercentInput()">
            <button type="button" onclick="openKateModal()" title="Näytä koko kaupan kateprosentti" style="padding:3px 7px;font-size:10px;background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:3px;cursor:pointer;white-space:nowrap;">📊 Kate</button>
          </div>
        </td>
      </tr>
      <tr>
        <td class="label">Pyöristys / alennus<br><span style="font-size:10px;font-weight:400;">(veroton)</span></td>
        <td class="value"><input class="adj" type="number" id="adjAmount" value="0" step="0.01" oninput="onAdjInput()"></td>
      </tr>
      <tr><td class="label">Veroton yhteensä</td><td class="value" id="sumNoTax">0,00 €</td></tr>
      <tr><td class="label">ALV 25,5%</td><td class="value" id="sumVat">0,00 €</td></tr>
      <tr class="big">
        <td class="label">YHT (verollinen)</td>

function setCustomer(id, name) {
  document.getElementById('customerId').value = id;
  document.getElementById('customerSearch').value = name;
  document.getElementById('customerDropdown').classList.remove('open');
  const cust = customers.find(c => c.id === id);
  if (cust) {
    renderCustomerInfo(cust);

    // näytettäväksi, koska vanhoissa tarjouksissa osoite pitää silti näkyä.

function renderCustomerInfo(cust) {
  const box = document.getElementById('customerInfoDisplay');
  if (!cust) { box.classList.remove('show'); box.innerHTML = ''; return; }
  const lines = [];
  if (cust.address || cust.city) {
    lines.push(`<div><span class="cid-label">Osoite</span>${[cust.address, cust.city].filter(Boolean).join(', ')}</div>`);
  }
  const hasBilling = cust.billing_address || cust.billing_postal_code || cust.billing_city;
  const billingDiffers = hasBilling && (cust.billing_address !== cust.address || cust.billing_city !== cust.city);
  if (hasBilling && billingDiffers) {
    lines.push(`<div><span class="cid-label">Laskutus</span>${[cust.billing_address, [cust.billing_postal_code, cust.billing_city].filter(Boolean).join(' ')].filter(Boolean).join(', ')}</div>`);
  }
  if (cust.email) {
    lines.push(`<div><span class="cid-label">Email</span>${cust.email}</div>`);
  }
  if (cust.phone) {
    lines.push(`<div><span class="cid-label">Puhelin</span>${cust.phone}</div>`);
  }
  if (!lines.length) { box.classList.remove('show'); box.innerHTML = ''; return; }
  box.innerHTML = lines.join('');

}

// NIMIKEHAKU (teksti)
// =============================================
function positionNimikeDropdown(secId, rowId) {
  const input = document.getElementById(`nimike-${secId}-${rowId}`);
  const dd = document.getElementById(`nimike-dd-${secId}-${rowId}`);
  if (!input || !dd) return;
  const rect = input.getBoundingClientRect();
  dd.style.top = (rect.bottom + 2) + 'px';
  dd.style.left = rect.left + 'px';
  dd.style.width = Math.max(rect.width, 320) + 'px';
}

function onNimikeFocus(secId, rowId) {
  positionNimikeDropdown(secId, rowId);
  onNimikeInput(secId, rowId, document.getElementById(`nimike-${secId}-${rowId}`).value);
}

function onNimikeInput(secId, rowId, val) {
  const sec = sections.find(s => s.id === secId);
  const row = sec && sec.rows.find(r => r.id === rowId);
  if (!row) return;
  row.hinnastoTeksti = val;
  const dd = document.getElementById(`nimike-dd-${secId}-${rowId}`);
  if (!dd) return;
  positionNimikeDropdown(secId, rowId);
  if (!products.length) {
    dd.innerHTML = '<div class="nimike-option" style="color:var(--text-dim)">Hinnastoa ei löydy — tarkista yhteys</div>';
    dd.classList.add('open');
    return;
  }
  const q = val.toLowerCase().trim();
  const isNumeric = /^\d+$/.test(q);
  const hits = q.length >= 1
    ? products.filter(p => {
        const code = String(p.code || '');
        if (isNumeric) {
          // Numerohaulla vain koodi
          return code === q || code.startsWith(q);
        } else {
          // Tekstihaulla nimi ja kategoria
          const name = (p.name || '').toLowerCase();
          const cat  = (p.category || '').toLowerCase();
          return name.includes(q) || cat.includes(q);
        }
      })
      .sort((a, b) => {
        const aExact = String(a.code||'') === q ? 0 : 1;
        const bExact = String(b.code||'') === q ? 0 : 1;
        if (aExact !== bExact) return aExact - bExact;
        return parseInt(a.code||0) - parseInt(b.code||0);
      })
      .slice(0, 122)
    : products.slice().sort((a,b) => parseInt(a.code||0) - parseInt(b.code||0));
  if (!hits.length) {
    dd.innerHTML = '<div class="nimike-option" style="color:var(--text-dim)">Ei tuloksia</div>';
    dd.classList.add('open');
    return;
  }
  dd.innerHTML = hits.map((p, i) =>
    `<div class="nimike-option" data-index="${i}" onclick="selectNimike(${secId},${rowId},'${p.id}')">
      <span class="nimike-code">${p.code||''}</span>${p.name}
      <span style="color:var(--text-dim);font-size:10px;margin-left:6px;">${p.unit||''}</span>
    </div>`
  ).join('');
  dd.classList.add('open');
}

function selectNimike(secId, rowId, productId) {
  const sec = sections.find(s => s.id === secId);
  const row = sec && sec.rows.find(r => r.id === rowId);
  if (!row) return;
  const prod = products.find(p => p.id === productId || String(p.id) === String(productId));
  if (prod) {
    row.productId = prod.id;
    row.hinnastoTeksti = (prod.code ? prod.code + ' – ' : '') + prod.name;
    if (!row.desc) row.desc = prod.name;
    row.unit = prod.unit || row.unit;
    row.basePrice = prod.price != null ? parseFloat(prod.price) : null;
    if (!row.priceManual && row.basePrice !== null) row.price = row.basePrice;
    row.isAssembly = prod.pricing_model === 'assembly';
    // Kate% tallennetaan katelaskentaa varten. Kokoonpanotuotteiden kate ei ole luotettava
    // (hinta koostuu komponenteista), joten niiden kate jätetään toistaiseksi tuntemattomaksi.
    row.katePercent = (!row.isAssembly && prod.kate_percent != null) ? parseFloat(prod.kate_percent) : null;
    // ALV-% tallennetaan aina (myös kokoonpanoille) — toisin kuin kate%, se on aina luotettava
    // tieto riippumatta hinnoittelumallista.
    row.vatPercent = prod.vat_percent != null ? parseFloat(prod.vat_percent) : 25.5;

    // Päivitä kentät suoraan DOM:iin
    const nimikeInput = document.getElementById(`nimike-${secId}-${rowId}`);
    if (nimikeInput) nimikeInput.value = row.hinnastoTeksti;

    // Päivitä kuvaus jos se muuttui
    const descInputs = document.querySelectorAll(`#row-${secId}-${rowId} input[placeholder="Kuvaus"]`);
    if (descInputs[0]) descInputs[0].value = row.desc || '';

    // Päivitä yksikkö
    const unitInputs = document.querySelectorAll(`#row-${secId}-${rowId} input[placeholder="kpl"]`);
    if (unitInputs[0]) unitInputs[0].value = row.unit || '';

    const priceInput = document.getElementById(`price-${secId}-${rowId}`);
    if (priceInput) priceInput.value = row.price || '';

    const pv = document.getElementById(`pricevat-${secId}-${rowId}`);
    if (pv) pv.textContent = row.price ? fmt4(grossPrice(row.price, row.vatPercent))+' €' : '';

    const rowSumEl = document.getElementById(`rowsum-${secId}-${rowId}`);
    if (rowSumEl) {
      const net = rowSum(row);
      rowSumEl.innerHTML = `${fmt(net)} €<br><span style="font-size:10px;color:var(--text-dim);">${fmt(grossPrice(net, row.vatPercent))} €</span>`;
    }

    recalcTotals();
  }
  const dd = document.getElementById(`nimike-dd-${secId}-${rowId}`);
  if (dd) dd.classList.remove('open');

  // Siirrä fokus kuvaus-kenttään
  setTimeout(() => {
    const descInputs = document.querySelectorAll(`#row-${secId}-${rowId} input[placeholder="Kuvaus"]`);
    if (descInputs[0]) descInputs[0].focus();
  }, 50);

  autoSave();
}

function addRow(secId) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  sec.rows.push({ id: ++rowIdCounter, productId: '', nimikeTeksti: '', hinnastoTeksti: '', desc: '', qty: '', unit: '', price: '', priceManual: false, basePrice: null, isAssembly: false, katePercent: null, vatPercent: null });
  renderSections();
  autoSave();
}

function removeRow(secId, rowId) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  sec.rows = sec.rows.filter(r => r.id !== rowId);
  renderSections();
  autoSave();
}

function removeSection(id) {
  if (sections.length <= 1) { alert('Vähintään yksi osio täytyy olla.'); return; }
  if (!confirm('Poistetaanko osio ja kaikki sen rivit?')) return;
  sections = sections.filter(s => s.id !== id);
  renderSections();
  autoSave();
}

function toggleSection(id) {
  const sec = sections.find(s => s.id === id);
  if (sec) { sec.active = !sec.active; renderSections(); autoSave(); }
}

function renameSection(id, val) {
  const sec = sections.find(s => s.id === id);
  if (sec) { sec.name = val; autoSave(); }
}

function moveSection(id, dir) {
  const idx = sections.findIndex(s => s.id === id);
  const nIdx = idx + dir;
  if (nIdx < 0 || nIdx >= sections.length) return;
  [sections[idx], sections[nIdx]] = [sections[nIdx], sections[idx]];
  renderSections();
  autoSave();
}

function onProductSelect(secId, rowId, productId) {
  selectNimike(secId, rowId, productId);
}

function onNimikeKeyDown(e, secId, rowId) {
  const dd = document.getElementById(`nimike-dd-${secId}-${rowId}`);
  if (!dd || !dd.classList.contains('open')) return;
  const items = dd.querySelectorAll('.nimike-option[data-index]');
  if (!items.length) return;
  const current = dd.querySelector('.nimike-option.active');
  let idx = current ? parseInt(current.dataset.index) : -1;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    idx = Math.min(idx + 1, items.length - 1);
    items.forEach(el => el.classList.remove('active'));
    items[idx].classList.add('active');
    items[idx].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    idx = Math.max(idx - 1, 0);
    items.forEach(el => el.classList.remove('active'));
    items[idx].classList.add('active');
    items[idx].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (current) current.click();
  } else if (e.key === 'Escape') {
    dd.classList.remove('open');
  }
}

function onRowInput(secId, rowId, field, val) {
  const sec = sections.find(s => s.id === secId);
  const row = sec && sec.rows.find(r => r.id === rowId);
  if (row) { row[field] = val; updateRowSum(secId, rowId); autoSave(); }
}

function onPriceInput(secId, rowId, val) {
  const sec = sections.find(s => s.id === secId);
  const row = sec && sec.rows.find(r => r.id === rowId);
  if (!row) return;
  row.price = val;
  row.priceManual = (row.basePrice !== null && parseFloat(val) !== parseFloat(row.basePrice));
  updateRowSum(secId, rowId);
  updatePriceManualUI(secId, rowId);
  autoSave();
}

// Päivittää price-manual-korostuksen ja restore/alennus-badgen heti kirjoittaessa, koskematta
// itse hintakenttään (vain classList + sisarelementin innerHTML) — jos koko rivin regeneroisi
// innerHTML:llä, hintakenttä menettäisi fokuksen/kursorin joka näppäimenpainalluksella.
function updatePriceManualUI(secId, rowId) {
  const sec = sections.find(s => s.id === secId);
  const row = sec && sec.rows.find(r => r.id === rowId);
  if (!row) return;
  const badgeHTML = renderPriceBadge(secId, row);
  const priceInput = document.getElementById(`price-${secId}-${rowId}`);
  if (priceInput) priceInput.classList.toggle('price-manual', !!row.priceManual);
  const badge = document.getElementById(`pricebadge-${secId}-${rowId}`);
  if (badge) badge.innerHTML = badgeHTML;
  const priceInputCard = document.getElementById(`pricecard-${secId}-${rowId}`);
  if (priceInputCard) priceInputCard.classList.toggle('price-manual', !!row.priceManual);
  const badgeCard = document.getElementById(`pricebadgecard-${secId}-${rowId}`);
  if (badgeCard) badgeCard.innerHTML = badgeHTML;
}

function restorePrice(secId, rowId) {
  const sec = sections.find(s => s.id === secId);
  const row = sec && sec.rows.find(r => r.id === rowId);
  if (!row || row.basePrice === null) return;
  row.price = row.basePrice;
  row.priceManual = false;
  renderSections();
  autoSave();
}

function updateRowSum(secId, rowId) {
  const sec = sections.find(s => s.id === secId);
  const row = sec && sec.rows.find(r => r.id === rowId);
  if (!row) return;
  const el = document.getElementById(`rowsum-${secId}-${rowId}`);
  if (el) {
    const net = rowSum(row);
    el.innerHTML = `${fmt(net)} €<br><span style="font-size:10px;color:var(--text-dim);">${fmt(grossPrice(net, row.vatPercent))} €</span>`;
  }
  const pv = document.getElementById(`pricevat-${secId}-${rowId}`);
  if (pv) pv.textContent = row.price ? fmt4(grossPrice(row.price, row.vatPercent))+' €' : '';
  const pvc = document.getElementById(`pricevatcard-${secId}-${rowId}`);
  if (pvc) pvc.textContent = row.price ? '('+fmt4(grossPrice(row.price, row.vatPercent))+' € s.alv)' : '';
  const ss = document.getElementById(`subsub-${secId}`);
  if (ss) ss.textContent = fmt(sectionSum(sec));
  recalcTotals();
}

function rowSum(row) { return (parseFloat(row.qty)||0) * (parseFloat(row.price)||0); }

function sectionSum(sec) {
  if (!sec.active) return 0;
  return sec.rows.reduce((a,r) => a + rowSum(r), 0);
}

function recalcTotals() {
  const sub = sections.reduce((a,s) => a + sectionSum(s), 0);
  const discountPercent = parseFloat(document.getElementById('discountPercent').value) || 0;
  const afterDiscount = sub * (1 - discountPercent / 100);
  const adj = parseFloat(document.getElementById('adjAmount').value) || 0;
  const noTax = afterDiscount + adj;
  const vat = noTax * computeQuoteVatRate(sections) / 100;
  const gross = noTax + vat;
  document.getElementById('sumSubtotal').textContent = fmt(sub) + ' €';
  document.getElementById('sumNoTax').textContent = fmt(noTax) + ' €';
  document.getElementById('sumVat').textContent = fmt(vat) + ' €';
  // Päivitä verollinen kenttä vain jos käyttäjä ei ole sitä editoimassa
  const grossEl = document.getElementById('adjGross');
  if (document.activeElement !== grossEl) {
    grossEl.value = Math.round(gross * 100) / 100;
  }
  sections.forEach(sec => {
    const el = document.getElementById(`subsub-${sec.id}`);
    if (el) el.textContent = fmt(sectionSum(sec));
  });
}

// Käyttäjä muuttaa alennusprosenttia → päivitä koko yhteenveto
function onDiscountPercentInput() {
  recalcTotals();
  autoSave();
}

// Käyttäjä muuttaa verotonta pyöristystä → päivitä verollinen YHT
function onAdjInput() {
  recalcTotals();
  autoSave();
}

// Käyttäjä kirjoittaa verollisen loppusumman → laske veroton pyöristys taaksepäin
// (alennus% pysyy ennallaan, vain pyöristys-kenttä sovitetaan kohdalleen)
function onGrossInput() {
  const sub = sections.reduce((a,s) => a + sectionSum(s), 0);
  const discountPercent = parseFloat(document.getElementById('discountPercent').value) || 0;
  const afterDiscount = sub * (1 - discountPercent / 100);
  const targetGross = parseFloat(document.getElementById('adjGross').value) || 0;
  const vatRate = computeQuoteVatRate(sections);
  const targetNet = targetGross / (1 + vatRate / 100);
  const adj = Math.round((targetNet - afterDiscount) * 100) / 100;
  document.getElementById('adjAmount').value = adj;
  const noTax = afterDiscount + adj;
  const vat = noTax * vatRate / 100;
  document.getElementById('sumSubtotal').textContent = fmt(sub) + ' €';
  document.getElementById('sumNoTax').textContent = fmt(noTax) + ' €';
  document.getElementById('sumVat').textContent = fmt(vat) + ' €';
  autoSave();
}

// =============================================
// KATEPROSENTTI (sisäinen, ei koskaan tulosteelle)
// =============================================
// Lasketaan vain riveiltä joiden kate% on tiedossa. Ryhmitellään kate%:n mukaan modaaliin.
function fmtQty(n) {
  return Number(n||0).toLocaleString('fi-FI', { maximumFractionDigits: 2 });
}

function computeKateBreakdown() {
  const groups = {};
  let unknownRows = 0, unknownRevenue = 0, totalRevenue = 0, knownRevenue = 0, knownCost = 0;
  sections.forEach(sec => {
    if (!sec.active) return;
    sec.rows.forEach(row => {
      const rs = rowSum(row);
      if (!rs) return;
      totalRevenue += rs;
      if (row.katePercent !== null && row.katePercent !== undefined && row.basePrice) {
        const key = row.katePercent.toFixed(4);
        if (!groups[key]) groups[key] = { katePercent: row.katePercent, rows: 0, revenue: 0, cost: 0 };
        const qty = parseFloat(row.qty) || 0;
        const unitCost = row.basePrice / (1 + row.katePercent);
        groups[key].rows += 1;
        groups[key].revenue += rs;
        groups[key].cost += qty * unitCost;
        knownRevenue += rs;
        knownCost += qty * unitCost;
      } else {
        unknownRows += 1;
        unknownRevenue += rs;
      }
    });
  });
  return { groups, unknownRows, unknownRevenue, totalRevenue, knownRevenue, knownCost };
}

function openKateModal() {
  const data = computeKateBreakdown();
  const sub = sections.reduce((a,s) => a + sectionSum(s), 0);
  const discountPercent = parseFloat(document.getElementById('discountPercent').value) || 0;
  const afterDiscount = sub * (1 - discountPercent / 100);
  const adj = parseFloat(document.getElementById('adjAmount').value) || 0;
  const noTax = afterDiscount + adj;
  const effectiveRatio = sub > 0 ? (noTax / sub) : 1;

  const sortedKeys = Object.keys(data.groups).sort((a,b) => data.groups[b].katePercent - data.groups[a].katePercent);
  let rowsHtml = sortedKeys.map(key => {
    const g = data.groups[key];
    return `<tr>
      <td style="padding:4px 6px;">${(g.katePercent*100).toLocaleString('fi-FI',{maximumFractionDigits:1})} %</td>
      <td class="right" style="padding:4px 6px;">${g.rows} rivi${g.rows===1?'':'ä'}</td>
      <td class="right" style="padding:4px 6px;">${fmt(g.revenue)} €</td>
    </tr>`;
  }).join('');
  if (data.unknownRevenue > 1) {
    rowsHtml += `<tr style="color:var(--text-dim);">
      <td style="padding:4px 6px;">Ei tiedossa</td>
      <td class="right" style="padding:4px 6px;">${data.unknownRows} rivi${data.unknownRows===1?'':'ä'}</td>
      <td class="right" style="padding:4px 6px;">${fmt(data.unknownRevenue)} €</td>
    </tr>`;
  }
  if (!rowsHtml) rowsHtml = `<tr><td colspan="3" style="padding:8px 6px;color:var(--text-dim);">Ei rivejä vielä.</td></tr>`;

  const knownRevenueAfter = data.knownRevenue * effectiveRatio;
  // Sama kate%-määritelmä kuin hinnastossa/per-rivi-taulukossa: kate lisätään OSTOHINNAN
  // päälle (myyntihinta = ostohinta × (1+kate%)), joten nimittäjä on kustannus, ei myyntihinta.
  const katePct = (data.knownCost > 0) ? ((knownRevenueAfter - data.knownCost) / data.knownCost) * 100 : null;

  document.getElementById('kateModalBody').innerHTML = `
    <table style="width:100%;border-collapse:collapse;">
      <thead>
        <tr style="border-bottom:1px solid var(--border);color:var(--text-dim);font-size:11px;">
          <th style="text-align:left;padding:4px 6px;font-weight:600;">Kate</th>
          <th class="right" style="padding:4px 6px;font-weight:600;">Rivejä</th>
          <th class="right" style="padding:4px 6px;font-weight:600;">Summa (veroton, ennen alennusta)</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border);">
      ${discountPercent > 0 ? `<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">Yllä olevat summat ovat ennen alennusta. Alennus ${discountPercent.toLocaleString('fi-FI',{maximumFractionDigits:1})} % (+ mahdollinen pyöristys) pienentää tuottoa kertoimella × ${effectiveRatio.toLocaleString('fi-FI',{minimumFractionDigits:3,maximumFractionDigits:3})} — tämä on jo huomioitu alla olevassa kokonaiskatteessa.</div>` : ''}
      <div style="font-size:14px;"><b>Koko kaupan kate alennuksen jälkeen: </b><span style="color:var(--accent);font-weight:600;">${katePct !== null ? katePct.toLocaleString('fi-FI', {minimumFractionDigits:1, maximumFractionDigits:1}) + ' %' : '– (ei hinnastotuotteita)'}</span></div>
      ${data.unknownRevenue > 1 ? `<div style="font-size:10px;color:var(--text-dim);margin-top:6px;">Huom: ${fmt(data.unknownRevenue)} € on kokoonpanoja tai vapaita "Kohde"-rivejä joiden kate ei ole tiedossa — ei mukana kateprosentissa.</div>` : ''}
    </div>
  `;
  document.getElementById('kateModal').classList.add('open');
}

function closeKateModal() {
  document.getElementById('kateModal').classList.remove('open');
}
document.getElementById('kateModal').addEventListener('click', e => {
  if (e.target === document.getElementById('kateModal')) closeKateModal();
});

function fmt(n) {
  return Number(n).toLocaleString('fi-FI', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Verollisen YKSIKKÖHINNAN (à-hinta) esikatseluun käytetään 4 desimaalia, samaan tapaan kuin
// nettohintakin näytetään täydellä tarkkuudella kuutiohinnoittelussa. TÄTÄ EI KÄYTETÄ rivi- tai
// tarjoussummiin — ne pysyvät 2 desimaalilla (fmt), koska ne ovat oikeaa, senttitarkkaa rahaa.
function fmt4(n) {
  return Number(n).toLocaleString('fi-FI', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
}

// =============================================
// ALV — lasketaan aina rivin/hinnaston omasta vat_percent-arvosta, ei kiinteällä
// kertoimella, jotta alv-kannan muuttuessa ei tarvitse koskea koodiin.
// =============================================
function grossPrice(net, vatPercent) {
  const vat = (vatPercent == null || vatPercent === '') ? 25.5 : parseFloat(vatPercent);
  return (parseFloat(net) || 0) * (1 + (isNaN(vat) ? 25.5 : vat) / 100);
}

// =============================================
// RIVIKOHTAINEN ALENNUS-% (2026-08) — vain kun käsin muokattu à-hinta on MATALAMPI kuin
// hinnaston basePrice (aito alennus). Jos hintaa on nostettu käsin, palautetaan null — sitä
// ei näytetä alennuksena. Käytetään sekä editorissa (tämä tiedosto) että print_quote.html:ssä
// (oma kopio siellä, ei jaettuja JS-moduuleja projektin tyylin mukaisesti).
// =============================================
function rowDiscountPercent(row) {
  const base = parseFloat(row.basePrice);
  if (row.basePrice === null || row.basePrice === undefined || isNaN(base) || base <= 0) return null;
  const price = parseFloat(row.price);
  if (isNaN(price) || price >= base) return null;
  return (base - price) / base * 100;
}

function fmtPct(n) {
  const s = n.toFixed(1);
  return s.endsWith('.0') ? s.slice(0, -2) : s;
}

// Renderöi restore-napin ja/tai alennusbadgen à-hinta-kentän viereen. Käytetään sekä
// initial-renderissä (renderRowHTML/renderCardHTML) että live-päivityksessä (onPriceInput),
// jotta molemmat pysyvät aina synkassa keskenään.
function renderPriceBadge(secId, row) {
  let html = '';
  const pct = rowDiscountPercent(row);
  if (pct !== null) {
    html += `<span class="discount-badge" title="Alennus hinnaston hinnasta ${fmt(row.basePrice)} €">-${fmtPct(pct)}%</span>`;
  }
  if (row.priceManual) {
    html += `<button class="restore-btn" onclick="restorePrice(${secId},${row.id})" title="Palauta laskettu hinta">↺</button>`;
  }
  return html;
}

// Koko ostoksen "tehollinen" alv-% painotettuna riveittäin niiden verottomalla summalla.
// Jos kaikilla riveillä sama alv-%, palauttaa täsmälleen sen. Rivit joilla ei ole vielä
// vatPercent-tietoa (esim. vapaat "Kohde"-tekstirivit) oletetaan 25.5%:iin, kuten muuallakin.
function computeQuoteVatRate(secs) {
  let weighted = 0, totalNet = 0;
  secs.forEach(sec => {
    if (!sec.active) return;
    sec.rows.forEach(row => {
      const net = rowSum(row);
      if (!net) return;
      const vp = (row.vatPercent == null || row.vatPercent === '') ? 25.5 : parseFloat(row.vatPercent);
      weighted += net * (isNaN(vp) ? 25.5 : vp);
      totalNet += net;
    });
  });
  return totalNet > 0 ? weighted / totalNet : 25.5;
}

// =============================================
// TALLENNUS
// =============================================
function buildQuoteData(status) {
  const sub = sections.reduce((a,s) => a + sectionSum(s), 0);
  const discountPercent = parseFloat(document.getElementById('discountPercent').value) || 0;
  const afterDiscount = sub * (1 - discountPercent / 100);
  const adj = parseFloat(document.getElementById('adjAmount').value) || 0;
  const noTax = afterDiscount + adj;
  const vat = noTax * computeQuoteVatRate(sections) / 100;
  return {
    customer_id: document.getElementById('customerId').value || null,
    quote_number: document.getElementById('quoteNumber').value || null,
    status: 'COMPLETED', // myymäläostos on aina heti maksettu, ei tilavirtaa
    sale_type: 'myymala',
    notes: document.getElementById('quoteRef').value || null,
    discount_amount: adj,
    discount_percent: discountPercent,
    sections_json: JSON.stringify(sections),
    is_template: false,
    total_net: Math.round(noTax * 100) / 100,
    total_vat: Math.round(vat * 100) / 100,
    total_gross: Math.round((parseFloat(document.getElementById('adjGross').value)||0) * 100) / 100,
  };
}

async function saveDraft() {
  const el = document.getElementById('saveStatus');
  el.className = 'saving'; el.textContent = 'Tallennetaan...';
  try {
    const data = buildQuoteData();
    let result;
    if (currentQuoteId) {
      result = await sbPatch('quotes', currentQuoteId, data);
    } else {
      result = await sbPost('quotes', data);
      if (result && result[0]) currentQuoteId = result[0].id;
    }
    el.className = 'saving ok'; el.textContent = '✓ Tallennettu';
    setTimeout(() => { if (el.textContent === '✓ Tallennettu') el.textContent = ''; }, 2500);
  } catch(e) {
    el.className = 'saving err'; el.textContent = 'Virhe tallennuksessa';
  }
}

// =============================================
// AUTO-SAVE
// =============================================
let _autoSaveTimer = null;

function autoSave() {
  const el = document.getElementById('saveStatus');
  // Jos ei vielä ID:tä, tallenna heti (uusi tarjous)
  if (!currentQuoteId) {
    saveDraft();
    return;
  }
  // Muuten debounce 2 sekuntia
  el.className = 'saving'; el.textContent = 'Muokattu...';
  clearTimeout(_autoSaveTimer);
  _autoSaveTimer = setTimeout(() => saveDraft(), 2000);
}


// =============================================
// LATAUS (myymäläostoksen avaus — käytännössä vain kuitin uudelleentarkastelu)
// =============================================
async function loadQuote(id) {
  const data = await sbGet('quotes', `?id=eq.${id}&select=*`);
  const q = Array.isArray(data) ? data[0] : null;
  if (!q) return;
  currentQuoteId = q.id;
  document.getElementById('quoteNumber').value = q.quote_number || '';
  document.getElementById('quoteDate').value = (q.created_at||'').slice(0,10);
  document.getElementById('quoteRef').value = q.notes || '';
  document.getElementById('adjAmount').value = q.discount_amount || 0;
  document.getElementById('discountPercent').value = q.discount_percent || 0;
  if (q.total_gross) document.getElementById('adjGross').value = q.total_gross;
  if (q.customer_id) {
    const cust = customers.find(c => c.id === q.customer_id);
    if (cust) setCustomer(cust.id, cust.name);
  }
  if (q.sections_json) {
    try {
      sections = JSON.parse(q.sections_json);
      sections.forEach(s => s.rows.forEach(r => {
        if (r.id > rowIdCounter) rowIdCounter = r.id;
        // Vanhemmat ostokset (ennen kate%-ominaisuutta) eivät sisällä katePercent-kenttää
        // riveillä, vaikka productId on tallessa. Täydennetään se tässä hinnastosta jotta
        // kateprosentti-modaali toimii myös vanhoilla ostoksilla, ilman että hintoihin koskee.
        if ((r.katePercent === undefined || r.katePercent === null) && r.productId) {
          const prod = products.find(p => p.id === r.productId || String(p.id) === String(r.productId));
          if (prod) {
            r.isAssembly = prod.pricing_model === 'assembly';
            r.katePercent = (!r.isAssembly && prod.kate_percent != null) ? parseFloat(prod.kate_percent) : null;
          }
        }
        // Vanhemmat ostokset eivät sisällä vatPercent-kenttää riveillä. Täydennetään
        // hinnastosta jotta alv lasketaan oikein myös vanhoilla ostoksilla, ilman
        // että hintoihin koskee. Jos tuotetta ei enää löydy, oletetaan 25.5%.
        if (r.vatPercent === undefined || r.vatPercent === null) {
          const prod = r.productId ? products.find(p => p.id === r.productId || String(p.id) === String(r.productId)) : null;
          r.vatPercent = prod && prod.vat_percent != null ? parseFloat(prod.vat_percent) : 25.5;
        }
      }));
      sections.forEach(s => { if (s.id > sectionIdCounter) sectionIdCounter = s.id; });
    } catch(e) { sections = []; addSection('Myymälämyynti'); }
  }
  renderSections();
}

// Käteisasiakas-pikanappi — ei vaadi nimen syöttöä, käyttää valmiiksi luotua "Käteisasiakas"-riviä customers-taulussa
function setCashCustomer() {
  const cash = customers.find(c => c.name === 'Käteisasiakas');
  if (cash) {
    setCustomer(cash.id, cash.name);
  } else {
    alert('Käteisasiakas-riviä ei löytynyt asiakasrekisteristä. Tarkista että se on luotu Supabaseen.');
  }
}

// =============================================
// TULOSTUS
