<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Tarjous — Okkosen Puutuote</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', Arial, sans-serif; font-size: 10pt; color: #000; background: #fff; }

  @page {
    size: A4;
    margin: 18mm 15mm 16mm 15mm;
    @bottom-right {
      content: counter(page) " / " counter(pages);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7.5pt;
      color: #444;
    }
  }
  .page-wrap { max-width: 180mm; margin: 0 auto; }

  .doc-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8mm; border-bottom: 1px solid #ccc; padding-bottom: 5mm; }
  .logo-area { display: flex; align-items: center; gap: 10px; }
  .logo-area img { height: 36px; width: auto; }
  .logo-area .company-name { font-size: 13pt; font-weight: 700; line-height: 1.15; }
  .doc-title { font-size: 11pt; font-weight: 700; letter-spacing: 0.08em; text-align: center; flex: 1; padding-top: 6px; }
  .doc-meta { text-align: right; font-size: 9pt; min-width: 55mm; }
  .doc-meta table { margin-left: auto; border-collapse: collapse; }
  .doc-meta td { padding: 2px 4px; }
  .doc-meta td:first-child { color: #555; white-space: nowrap; }
  .doc-meta td:last-child { font-weight: 600; }

  .info-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6mm; }
  .customer-block { font-size: 9.5pt; line-height: 1.5; }
  .customer-block .name { font-size: 11pt; font-weight: 700; }

  .summary-top { text-align: right; font-size: 9pt; }
  .summary-top table { border-collapse: collapse; margin-left: auto; }
  .summary-top td { padding: 1px 4px; }
  .summary-top td:first-child { color: #555; }
  .summary-top .total-line { font-size: 12pt; font-weight: 700; margin-top: 3px; }

  .intro-text { margin-bottom: 5mm; font-size: 9.5pt; text-align: left; }

  .product-table { width: 100%; border-collapse: collapse; margin-bottom: 6mm; font-size: 9pt; }
  .product-table th { border-bottom: 1.5px solid #222; padding: 4px 6px; text-align: left; font-weight: 600; font-size: 8.5pt; }
  .product-table th.right { text-align: right; }
  .product-table td { padding: 4px 6px; border-bottom: 1px solid #ddd; vertical-align: top; text-align: left; font-weight: 500; color: #111; }
  .product-table td.right { text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 8.5pt; white-space: nowrap; }
  .product-table .section-hdr td { background: #f0f0f0; font-weight: 700; font-size: 9pt; border-bottom: 1px solid #bbb; border-top: 3px solid #555; padding: 5px 6px; }
  /* Estää rivin (ja osio-otsikon) katkeamisen kesken sivunvaihdon, sekä sen että osio-otsikko
     jää yksin sivun loppuun ilman sen rivejä perässä */
  .product-table tr { page-break-inside: avoid; break-inside: avoid; }
  .product-table .section-hdr { page-break-after: avoid; break-after: avoid; }
  /* Nämä kaksi riviä (yhteenveto+huomiot, sekä footer) eivät ole tavallisia tuoteriveja,
     joten niiltä poistetaan oletusreunaviiva ja niiden oma sisäinen tyyli hoitaa ulkoasun */
  .product-table .summary-row td, .product-table tfoot td { border-bottom: none; padding: 0 6px; }
  .product-table .summary-row td { padding-top: 8px; }

  .summary-bottom { display: flex; justify-content: flex-end; margin-bottom: 6mm; }
  .summary-box { width: 80mm; border-top: 1.5px solid #222; padding-top: 4px; }
  .summary-box table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
  .summary-box td { padding: 2px 4px; }
  .summary-box .lbl { color: #555; }
  .summary-box .val { text-align: right; font-family: 'IBM Plex Mono', monospace; }
  .summary-box .total td { font-size: 12pt; font-weight: 700; border-top: 1px solid #bbb; padding-top: 4px; }

  .footer-text { font-size: 8.5pt; color: #333; line-height: 1.5; white-space: pre-wrap; border-top: 1px solid #ccc; padding-top: 5mm; margin-bottom: 6mm; text-align: left; }

  /* Footer on nyt taulukon <tfoot>, ei enää position:fixed — selain toistaa sen itse jokaisella
     tulostetulla sivulla ja varaa sille oikeasti tilaa, jolloin tuoterivit eivät enää voi jäädä
     sen alle piiloon sivunvaihdon kohdalla (vanha kovakoodattu bugi, korjattu 2026-07-xx). */
  .doc-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3mm 0 1mm;
    border-top: 1px solid #bbb;
    font-size: 7.5pt; color: #444;
  }
  .doc-footer .col { display: flex; flex-direction: column; gap: 1px; line-height: 1.45; }
  .doc-footer .col.center { text-align: center; }
  .doc-footer .col.right { text-align: right; }
  .doc-footer .quote-num { font-size: 8.5pt; font-weight: 700; color: #111; margin-top: 2px; }

  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .no-print { display: none !important; }
  }
  @media screen {
    body { background: #eee; padding: 20px; }
    .page-wrap { background: #fff; padding: 18mm 15mm 26mm; box-shadow: 0 2px 16px rgba(0,0,0,0.15); }
  }

  .btn-print { position: fixed; top: 12px; right: 12px; background: #d97706; color: #fff; border: none; border-radius: 4px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; z-index: 99; }
  .btn-print:hover { background: #b45309; }
  .loading { text-align: center; padding: 40px; font-size: 14px; color: #888; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
</head>
<body>

<button class="btn-print no-print" onclick="window.print()">🖨 Tulosta</button>

<div id="root" class="loading">Ladataan tarjousta...</div>

<script>
const SUPABASE_URL = 'https://iofjnoxvksbaqorqaydh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlvZmpub3h2a3NiYXFvcnFheWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MjYzNjcsImV4cCI6MjA5MTQwMjM2N30.7aYtakimbUHcxyv6Jco2ggt4VdS2F68xydTbi9suAPo';

async function sbGet(table, params = '') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  return r.json();
}

function fmt(n) {
  return Number(n||0).toLocaleString('fi-FI', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Verollisen YKSIKKÖHINNAN (à-hinta) esikatseluun käytetään 4 desimaalia, samaan tapaan kuin
// nettohintakin näytetään täydellä tarkkuudella kuutiohinnoittelussa. TÄTÄ EI KÄYTETÄ rivi- tai
// tarjoussummiin — ne pysyvät 2 desimaalilla (fmt), koska ne ovat asiakkaalle näkyvää,
// senttitarkkaa rahaa eivätkä saa koskaan poiketa laskun loppusummista.
function fmt4(n) {
  return Number(n||0).toLocaleString('fi-FI', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
}

// ALV — lasketaan aina rivin omasta vatPercent-arvosta (tallennettu sections_json:iin
// tarjous.html/myymala.html:stä), ei kiinteällä kertoimella. Vanhemmilla tarjouksilla,
// joita ei ole avattu uudemmalla tarjous.html:llä, vatPercent-kenttää ei vielä ole
// riveillä — oletetaan silloin 25.5%, sama fallback kuin muuallakin sovelluksessa.
function grossPrice(net, vatPercent) {
  const vat = (vatPercent == null || vatPercent === '') ? 25.5 : parseFloat(vatPercent);
  return (parseFloat(net) || 0) * (1 + (isNaN(vat) ? 25.5 : vat) / 100);
}

// Koko tarjouksen/kuitin "tehollinen" alv-% painotettuna riveittäin niiden verottomalla
// summalla. Jos kaikilla riveillä sama alv-%, palauttaa täsmälleen sen.
function computeQuoteVatRate(secs) {
  let weighted = 0, totalNet = 0;
  secs.forEach(sec => {
    if (!sec.active) return;
    sec.rows.forEach(row => {
      const net = (parseFloat(row.qty)||0) * (parseFloat(row.price)||0);
      if (!net) return;
      const vp = (row.vatPercent == null || row.vatPercent === '') ? 25.5 : parseFloat(row.vatPercent);
      weighted += net * (isNaN(vp) ? 25.5 : vp);
      totalNet += net;
    });
  });
  return totalNet > 0 ? weighted / totalNet : 25.5;
}

function fmtVatRate(rate) {
  return rate.toLocaleString('fi-FI', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

// =============================================
// RIVIKOHTAINEN ALENNUS-% (2026-08) — sama logiikka kuin tarjous.html/myymala.html:ssä (oma
// kopio, ei jaettuja JS-moduuleja projektin tyylin mukaisesti). Näytetään vain kun rivin à-hinta
// on käsin muutettu MATALAMMAKSI kuin hinnaston basePrice (aito alennus) — jos hintaa on
// nostettu käsin, ei näytetä mitään erikoista, rivi tulostuu kuten ennenkin.
// =============================================
function rowDiscountPercent(row) {
  const base = parseFloat(row.basePrice);
  if (row.basePrice === null || row.basePrice === undefined || isNaN(base) || base <= 0) return null;
  const price = parseFloat(row.price);
  if (isNaN(price) || price >= base) return null;
  return (base - price) / base * 100;
}

function fmtPct(n) {
  const s = n.toFixed(1);
  return s.endsWith('.0') ? s.slice(0, -2) : s;
}

// Rakentaa à-hinta-solun sisällön. Normaalisti (ei alennusta): à-hinta + verollinen à-hinta
// pienellä, kuten ennenkin — täysin muuttumaton. Kun rivillä on aito alennus, käytetään
// 2-sarakkeista minitaulukkoa: sarake 1 = itse hinta (yliviivattu alkuperäinen / uusi / verollinen),
// aina samassa pystysuorassa kohdassa riveittäin, sarake 2 = alennusbadge vain keskirivillä.
// Näin "4,70" ja "4,46" pysyvät suoraan alekkain riippumatta badgen leveydestä — jos badge
// olisi osa samaa oikealle tasattua riviä, se työntäisi hintaluvun eri kohtaan kuin ylärivillä
// (huomattiin Tuomon tarkistuksessa 2026-08, kuvakaappaus print_quote.html:stä).
function priceCellHTML(row) {
  const priceStr = row.price ? fmt(row.price) + ' €' : '';
  const grossStr = row.price ? fmt4(grossPrice(row.price, row.vatPercent)) + ' €' : '';
  const pct = rowDiscountPercent(row);
  if (pct !== null) {
    const baseStr = fmt(row.basePrice) + ' €';
    return `<table style="margin-left:auto;border-collapse:collapse;">
      <tr><td style="text-align:right;padding:0;text-decoration:line-through;color:#999;font-size:7.5pt;">${baseStr}</td><td style="padding:0;"></td></tr>
      <tr><td style="text-align:right;padding:0;">${priceStr}</td><td style="text-align:left;padding:0 0 0 4px;color:#2e7d4f;font-weight:700;font-size:7.5pt;">-${fmtPct(pct)}%</td></tr>
      <tr><td style="text-align:right;padding:0;font-size:7.5pt;color:#777;">${grossStr}</td><td style="padding:0;"></td></tr>
    </table>`;
  }
  return `${priceStr}<br>${grossStr ? '<span style="font-size:7.5pt;color:#777;">' + grossStr + '</span>' : ''}`;
}

function fmtDate(s) {
  if (!s) return '';
  return s.slice(0,10).split('-').reverse().join('.');
}

// Sama viikkolaskenta kuin tarjous.html:n viikkoselaimessa
function mondayOfWeek(year, week) {
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const jan4day = jan4.getUTCDay() || 7;
  const monday = new Date(jan4);
  monday.setUTCDate(jan4.getUTCDate() - (jan4day - 1) + (week - 1) * 7);
  return monday;
}

function fmtDeliveryWeek(key) {
  if (!key) return '';
  const m = /^(\d{4})-(\d{1,2})$/.exec(key.trim());
  if (!m) return key;
  const year = parseInt(m[1], 10), week = parseInt(m[2], 10);
  const monday = mondayOfWeek(year, week);
  const sunday = new Date(monday);
  sunday.setUTCDate(monday.getUTCDate() + 6);
  const f = d => `${d.getUTCDate()}.${d.getUTCMonth()+1}.`;
  const suffix = sunday.getUTCFullYear() !== monday.getUTCFullYear() ? `${sunday.getUTCFullYear()}` : `${monday.getUTCFullYear()}`;
  return `Vko ${week} (${f(monday)}–${f(sunday)}${suffix})`;
}

window.addEventListener('DOMContentLoaded', async () => {
  await window._authReady;
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const showPrices = params.get('prices') !== '0';
  const showQty = showPrices && params.get('qty') !== '0';
  if (!id) { document.getElementById('root').textContent = 'Tarjousnumero puuttuu URL:sta.'; return; }

  const [quoteArr, custArr] = await Promise.all([
    sbGet('quotes', `?id=eq.${id}&select=*`),
    sbGet('customers', '?select=id,name,address,city,billing_address,billing_postal_code,billing_city,email')
  ]);
  const q = Array.isArray(quoteArr) ? quoteArr[0] : null;
  if (!q) { document.getElementById('root').textContent = 'Tarjousta ei löydy.'; return; }

  const cust = Array.isArray(custArr) ? custArr.find(c => c.id === q.customer_id) : null;
  const custName = cust ? cust.name : '—';
  // Laskutusosoite ensisijaisena, tavallinen osoite varalla jos laskutusosoitetta ei ole täytetty
  const custStreet = cust ? (cust.billing_address || cust.address || '') : '';
  const custCityLine = cust ? [cust.billing_postal_code || '', cust.billing_city || cust.city || ''].filter(Boolean).join(' ') : '';

  let sections = [];
  try { sections = JSON.parse(q.sections_json || '[]'); } catch(e) {}

  const discountPercent = parseFloat(q.discount_percent) || 0;
  // HUOM: discountPercent vaikuttaa vain loppusummiin, ei näy omana rivinä tulosteella (päätetty 2026-07-xx,
  // Tuomo ei ollut tavoitettavissa päättämään halutaanko "Alennus -X%" näkyä asiakkaalle). Jos halutaan
  // näyttää jatkossa, lisää tähän esim. rivi doc-metaan tai summary-boxiin: `Alennus: -${discountPercent} %`.
  // Ks. todo.txt.
  const adj = parseFloat(q.discount_amount) || 0;
  const sub = sections.reduce((a,s) => {
    if (!s.active) return a;
    return a + s.rows.reduce((b,r) => b + (parseFloat(r.qty)||0)*(parseFloat(r.price)||0), 0);
  }, 0);
  const afterDiscount = sub * (1 - discountPercent / 100);
  const noTax = afterDiscount + adj;
  const vatRate = computeQuoteVatRate(sections);
  const vat = noTax * vatRate / 100;
  // Käytetään tallennettua total_gross jos saatavilla (pyöristetty arvo), muuten lasketaan
  const total = q.total_gross ? parseFloat(q.total_gross) : noTax + vat;

  // colspan: showPrices lisää 2, showQty lisää 2
  const colspanSec = 1 + (showQty ? 2 : 0) + (showPrices ? 2 : 0);

  let rowsHTML = '';
  sections.forEach(sec => {
    if (!sec.active) return;
    rowsHTML += `<tr class="section-hdr"><td colspan="${colspanSec}">${sec.name}</td></tr>`;
    sec.rows.forEach(row => {
      if (!(parseFloat(row.qty) > 0)) return;
      const teksti = row.desc || row.nimikeTeksti || '';
      const rs = (parseFloat(row.qty)||0) * (parseFloat(row.price)||0);
      const rsVat = grossPrice(rs, row.vatPercent);
      rowsHTML += `<tr>
        <td>${teksti}</td>
        ${showQty ? `<td class="right">${row.qty || ''}</td><td>${row.unit || ''}</td>` : ''}
        ${showPrices ? `<td class="right" style="line-height:1.3;">${priceCellHTML(row)}</td><td class="right" style="line-height:1.3;">${rs ? fmt(rs) + ' €' : ''}<br>${rs ? '<span style="font-size:7.5pt;color:#777;">' + fmt(rsVat) + ' €</span>' : ''}</td>` : ''}
      </tr>`;
    });
  });

  const theadCols = `
    <th>Tuote ja lisätiedot</th>
    ${showQty ? `<th class="right" style="width:9%">Määrä</th><th style="width:7%">Yksikkö</th>` : ''}
    ${showPrices ? `<th class="right" style="width:15%">Alv 0%<br><span style="font-weight:400;font-size:7.5pt;color:#777;">sis. ALV</span></th><th class="right" style="width:18%">Rivihinta<br><span style="font-weight:400;font-size:7.5pt;color:#777;">sis. ALV</span></th>` : ''}
  `;
  const theadHTML = `<tr>${theadCols}</tr>`;

  // Yhteenveto (Alv 0%/Alv/YHT) ja mahdollinen footer_text ovat nyt osa tbody:tä (oma rivi taulukon
  // lopussa), eivät enää erillisiä diveja taulukon ulkopuolella. Tämä on tärkeää, jotta ne pysyvät
  // aina tuoterivien JÄLKEEN eivätkä koskaan päädy tfoot-footerin yläpuolelle väärässä kohdassa
  // silloin kun koko sisältö mahtuu yhdelle sivulle asti.
  rowsHTML += `<tr class="summary-row"><td colspan="${colspanSec}">
    <div class="summary-bottom">
      <div class="summary-box">
        <table>
          <tr><td class="lbl">Alv 0%:</td><td class="val">${fmt(noTax)} €</td></tr>
          <tr><td class="lbl">Alv ${fmtVatRate(vatRate)}%:</td><td class="val">${fmt(vat)} €</td></tr>
          <tr class="total"><td class="lbl">YHT:</td><td class="val">${fmt(total)} €</td></tr>
        </table>
      </div>
    </div>
    ${q.footer_text ? `<div class="footer-text">${q.footer_text}</div>` : ''}
  </td></tr>`;

  // Myymälästä tulleet ostokset (sale_type='myymala') tulostetaan kuittina, muut tarjouksena
  const isReceipt = q.sale_type === 'myymala';
  document.title = (isReceipt ? 'Kuitti' : 'Tarjous') + ' — Okkosen Puutuote';

  document.getElementById('root').innerHTML = `
  <div class="page-wrap">

    <div class="doc-header">
      <div class="logo-area">
        <img src="https://otuomo.github.io/hirsi-tarjous/orders/okkonenlogopuu.svg" alt="Logo">
        <div class="company-name">OKKOSEN<br>PUUTUOTE</div>
      </div>
      <div class="doc-title">${isReceipt ? 'KUITTI' : 'TARJOUS'}</div>
      <div class="doc-meta">
        <table>
          <tr><td>${isReceipt ? 'Kuittinumero' : 'Tarjousnumero'}</td><td>${q.quote_number || ''}</td></tr>
          ${q.delivery_week ? `<tr><td>Toimitusviikko</td><td>${fmtDeliveryWeek(q.delivery_week)}</td></tr>` : ''}
          <tr><td>${isReceipt ? 'Päivämäärä' : 'Tarjouksen antopäivä'}</td><td>${fmtDate(q.created_at)}</td></tr>
          ${isReceipt ? '' : `<tr><td>Tarjous voimassa</td><td>${fmtDate(q.valid_until)}</td></tr>`}
        </table>
      </div>
    </div>

    <div class="info-row">
      <div class="customer-block" style="text-align:left;">
        <div class="name">${custName}</div>
        ${custStreet ? `<div style="font-size:11pt;">${custStreet}</div>` : ''}
        ${custCityLine ? `<div style="font-size:11pt;">${custCityLine}</div>` : ''}
      </div>
      <div class="summary-top">
        <table>
          <tr><td>Alv 0%:</td><td><b>${fmt(noTax)} €</b></td></tr>
          <tr><td>Alv:</td><td><b>${fmt(vat)} €</b></td></tr>
        </table>
        <div class="total-line">YHT ${fmt(total)} €</div>
      </div>
    </div>

    ${q.notes ? `<div style="font-size:10pt;font-weight:600;margin-bottom:2mm;text-align:left;">${q.notes}</div>` : ''}
    <div class="intro-text">${isReceipt ? 'Kiitos ostoksestasi!' : 'Kiitämme tarjouspyynnöstänne. Tarjoamme tuotteitamme teille seuraavasti:'}</div>

    <table class="product-table">
      <thead>${theadHTML}</thead>
      <tbody>${rowsHTML}</tbody>
      <tfoot>
        <tr><td colspan="${colspanSec}">
          <div class="doc-footer">
            <div class="col">
              <span>Okkosen Puutuote Oy</span>
              <span>Sievintie 149</span>
              <span>85160 Rautio</span>
            </div>
            <div class="col center">
              <span>Puhelin: 0500-360 741</span>
              <span>myynti@okkosenpuutuote.com</span>
              <span>www.okkosenpuutuote.com</span>
            </div>
            <div class="col right">
              <span>Y-Tunnus: 3579911-5</span>
              <div class="quote-num">${isReceipt ? 'Kuittinumero' : 'Tarjousnumero'} ${q.quote_number || ''}</div>
            </div>
          </div>
        </td></tr>
      </tfoot>
    </table>

  </div>`;
});
</script>
</body>
</html>
